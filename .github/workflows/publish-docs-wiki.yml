name: Publish docs wiki

on:
  push:
    branches: [main]
    paths: ['openwiki/**']
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch docs Pages
        env:
          GH_TOKEN: ${{ secrets.DOCS_PAGES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing DOCS_PAGES_TOKEN secret"
            exit 1
          fi
          gh workflow run pages.yml --ref main --repo Cringe-Driven-Development-Team/docs
