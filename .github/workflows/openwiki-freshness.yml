name: OpenWiki freshness

on:
  pull_request:
    paths:
      - 'openwiki/**'
      - '!openwiki/INSTRUCTIONS.md'

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Reject source paths in the wiki PR
        run: bun scripts/openwiki-check-pr.ts "$TARGET_SHA" "$PR_HEAD_SHA"
      - name: Check wiki against the PR base
        run: |
          set -o pipefail
          bun scripts/openwiki-check.ts --against "$TARGET_SHA" 2>&1 | tee "$RUNNER_TEMP/openwiki-check.txt"
      - name: Report source, target and changed paths
        if: always()
        run: |
          {
            echo '## OpenWiki freshness'
            echo '```text'
            if [ -f "$RUNNER_TEMP/openwiki-check.txt" ]; then
              cat "$RUNNER_TEMP/openwiki-check.txt"
            fi
            echo "PR base / target SHA: $TARGET_SHA"
            echo "PR head SHA: $PR_HEAD_SHA"
            echo 'Changed PR paths:'
            git diff --name-only --no-renames "$TARGET_SHA...$PR_HEAD_SHA" --
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
