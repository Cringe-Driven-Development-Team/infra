name: actionlint

# Проверка workflows до мержа: синтаксис, выражения, shellcheck в run-шагах. Без секретов и без
# preview/apply инфраструктуры — запускается только от изменений самих workflows.
on:
  pull_request:
    paths:
      - .github/workflows/*.yml
      - .github/workflows/*.yaml

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Образ с зафиксированной версией; в нём же shellcheck для run-шагов
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          # shortcut: actionlint 1.7.12 lacks queue; remove when supported (rhysd/actionlint#657).
          # Hex escapes keep the exact regex in one Docker-action argument without shell quoting.
          args: -color -ignore ^unexpected\x20key\x20\x22queue\x22\x20for\x20\x22concurrency\x22\x20section\.
