---
- name: "Проверки с управляющей машины"
  hosts: localhost
  gather_facts: false
  vars:
    public_ip: "{{ hostvars[groups['gateway'][0]]['ansible_host'] }}"
  tasks:
    # Inventory строится из серверов проекта (openstack.yml): прод-VPS (gateway) ровно одна, кроме
    # неё допускается только вспомогательная VPS (группа auxiliary, auxiliary.yml).
    - name: В проекте ровно одна прод-VPS
      ansible.builtin.assert:
        that:
          - groups['gateway'] | length == 1
          - groups['all'] | difference(groups['gateway']) | difference(groups['auxiliary'] | default([])) | length == 0
        fail_msg: "Ожидалась одна прод-VPS и вспомогательные (auxiliary), в inventory: {{ groups['all'] }}"

    # BFF выкачен, если в .env на VPS есть BFF_IMAGE_TAG (роль app); до первой выкатки Caddy отвечает
    # заглушкой. Тег — для проверки релиза в HTML.
    - name: Окружение приложения на VPS
      ansible.builtin.slurp:
        src: "{{ app_compose_dir }}/.env"
      delegate_to: "{{ groups['gateway'][0] }}"
      become: true
      register: verify_app_environment
      failed_when: false
      no_log: true

    - name: Выкачен ли BFF
      ansible.builtin.set_fact:
        verify_bff_tag: >-
          {{ verify_app_environment.content | default('') | b64decode
          | regex_findall('(?m)^BFF_IMAGE_TAG=(sha-[0-9a-f]{7,40})$')
          | first | default('') }}

    - name: До первой выкатки BFF домен отвечает заглушкой
      ansible.builtin.uri:
        url: "https://{{ app_domain }}/"
        status_code: 503
        return_content: true
      register: verify_placeholder
      until: verify_placeholder is succeeded
      retries: 5
      delay: 5
      failed_when: >-
        verify_placeholder.status != 503
        or verify_placeholder.content != 'BFF is not deployed'
        or verify_placeholder.x_content_type_options | default('') != 'nosniff'
      when: verify_bff_tag == ''

    - name: BFF отвечает снаружи как положено
      ansible.builtin.import_tasks: roles/app/tasks/probe-bff.yml
      vars:
        bff_probe_tag: "{{ verify_bff_tag }}"
      when: verify_bff_tag != ''

    - name: Выдать информацию о сертификате
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          echo | openssl s_client -connect {{ app_domain }}:443 -servername {{ app_domain }} 2>/dev/null
          | grep -E '^(issuer|subject)='
        executable: /bin/bash
      register: cert_info
      changed_when: false

    - name: Сертификат выдан Let's Encrypt
      ansible.builtin.assert:
        that: cert_info.stdout is search("Encrypt|ISRG")
        fail_msg: "Сертификат не от Let's Encrypt: {{ cert_info.stdout }}"

    - name: "На публичном IP открыты 22/80/443"
      ansible.builtin.wait_for:
        host: "{{ public_ip }}"
        port: "{{ item }}"
        timeout: 10
      loop: [22, 80, 443]

    # Наружу должен смотреть только Caddy (и ssh). Postgres/Go API в Compose не публикуются,
    # Docker API (2375/2376) по умолчанию выключен. Проба с управляющей машины ловит и
    # порты, которые Docker открыл в обход ufw (DNAT раньше INPUT): доходит до хоста,
    # где docker-proxy слушает на 0.0.0.0.
    - name: "На публичном IP закрыты 5432, 6379, 8080, 2375, 2376"
      ansible.builtin.wait_for:
        host: "{{ public_ip }}"
        port: "{{ item }}"
        state: stopped
        connect_timeout: 3
        timeout: 10
        msg: "На публичном IP {{ public_ip }} принимает соединения {{ item }}/tcp"
      loop: [5432, 6379, 8080, 2375, 2376]

- name: "Проверки на VPS"
  hosts: gateway
  gather_facts: false
  become: true
  tasks:
    # Redis (infra#46) поднимает роль app вместе с бэком (deploy-backend.yml): пока выкатки с Redis
    # не было, нет и его конфига — проверка пропускается
    - name: Выкачен ли Redis на VPS
      ansible.builtin.stat:
        path: "{{ app_compose_dir }}/redis/redis.conf"
      register: verify_redis_conf

    # Клиент — одноразовый контейнер сервиса redis в сети app, как Go API. Пароль (REDISCLI_AUTH)
    # он берёт из .env Compose: через environment Ansible секрет попал бы в verbose-логи (-vvv)
    - name: Redis отвечает на PING из сети app
      ansible.builtin.command:
        cmd: docker compose run --rm --no-deps redis redis-cli -h redis ping
        chdir: "{{ app_compose_dir }}"
      register: verify_redis_ping
      changed_when: false
      failed_when: verify_redis_ping.rc != 0 or verify_redis_ping.stdout | trim != 'PONG'
      when: verify_redis_conf.stat.exists

    - name: Правила ufw
      ansible.builtin.command: ufw status verbose
      register: ufw_status
      changed_when: false

    - name: Разрешающие правила ufw
      ansible.builtin.set_fact:
        ufw_allow_rules: "{{ ufw_status.stdout_lines | select('search', ' ALLOW ') | list }}"

    # ufw на Anywhere заводит по строке на family (v4+v6), сравниваем уникальные порт/прото.
    # Первое слово строки без обратных слешей: их экранирование в шаблонах разное в версиях ansible-core.
    - name: Порт/прото разрешённых правил ufw и ожидаемых из firewall_rules
      ansible.builtin.set_fact:
        ufw_allow_ports: >-
          {{ ufw_allow_rules | map('regex_search', '^[^ ]+') | unique | sort | list }}
        expected_allow_ports: >-
          {{ firewall_rules | map(attribute='port') | zip(firewall_rules | map(attribute='proto'))
             | map('join', '/') | sort | list }}

    - name: "UFW: активен, входящие запрещены, разрешающих правил ровно {{ firewall_rules | length }}"
      ansible.builtin.assert:
        that:
          - "ufw_status.stdout is search('(?m)^Status: active$')"
          - ufw_status.stdout is search('deny [(]incoming[)]')
          - ufw_allow_ports == expected_allow_ports
        fail_msg: "ufw: {{ ufw_status.stdout }}; разрешено: {{ ufw_allow_ports }}, ждали: {{ expected_allow_ports }}"

    - name: "UFW: разрешено порт/прото {{ item.port ~ '/' ~ item.proto }}"
      ansible.builtin.assert:
        that: >-
          ufw_allow_rules
          | select('search', '^' ~ item.port ~ '/' ~ item.proto ~ '[ ]+ALLOW IN')
          | list | length > 0
        fail_msg: "{{ ufw_status.stdout }}"
      loop: "{{ firewall_rules }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Эффективный конфиг sshd (sshd -T)
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          sshd -T | grep -E
          '^(permitrootlogin|passwordauthentication|kbdinteractiveauthentication|allowtcpforwarding) '
        executable: /bin/bash
      register: sshd_effective
      changed_when: false

    - name: "Hardening активен: root/пароли выключены, форвардинг запрещён (jump-хост не нужен)"
      ansible.builtin.assert:
        that:
          - sshd_effective.stdout is search('(?m)^permitrootlogin no$')
          - sshd_effective.stdout is search('(?m)^passwordauthentication no$')
          - sshd_effective.stdout is search('(?m)^kbdinteractiveauthentication no$')
          - sshd_effective.stdout is search('(?m)^allowtcpforwarding no$')
        fail_msg: "sshd -T: {{ sshd_effective.stdout }}"

    # Какие TCP-порты слушает не на loopback: publishing-порты Docker смотрят прямо наружу
    # мимо ufw — проверяем, что вне allowlist (22/80/443) слушающего нет.
    - name: Слушающие TCP-порты (кроме loopback)
      ansible.builtin.shell:
        cmd: |
          python3 - <<'EOF'
          import json, subprocess
          out = subprocess.run(["ss", "-Hltn"], capture_output=True, text=True, check=True).stdout
          ports = set()
          for line in out.splitlines():
              addr, _, port = line.split()[3].rpartition(":")
              if addr.startswith("127.") or addr == "[::1]" or "%lo" in addr:
                  continue
              ports.add(int(port))
          print(json.dumps(sorted(ports)))
          EOF
        executable: /bin/bash
      register: host_listen
      changed_when: false

    - name: "Слушаются только порты из allowlist {{ firewall_rules | map(attribute='port') | list }}"
      ansible.builtin.assert:
        that: >-
          (host_listen.stdout | from_json)
          | difference(firewall_rules | map(attribute='port') | map('int') | list) | length == 0
        fail_msg: "Слушаются порты {{ host_listen.stdout }} — наружу смотрит лишнее (Docker -p?)"

# Вспомогательная VPS (infra#54, auxiliary.yml): сервис вебхуков отвечает по HTTPS с действительным
# сертификатом, а его внутренний порт и Docker снаружи закрыты (security group и сеть Compose без ports).
- name: "Проверки вспомогательной VPS"
  hosts: localhost
  gather_facts: false
  vars:
    auxiliary_host: "{{ (groups['auxiliary'] | default([]) + [''])[0] }}"
    auxiliary_hooks_domain: "{{ hostvars[auxiliary_host]['hooks_domain'] | default('') if auxiliary_host else '' }}"
    auxiliary_hooks_port: "{{ hostvars[auxiliary_host]['hooks_port'] | default(8080) if auxiliary_host else 8080 }}"
  tasks:
    - name: Вспомогательной VPS нет в inventory
      ansible.builtin.meta: end_play
      when: auxiliary_host == ''

    # uri проверяет цепочку доверия: недействительный сертификат — ошибка, а не статус
    - name: "https://{{ auxiliary_hooks_domain }}/health отвечает 200"
      ansible.builtin.uri:
        url: "https://{{ auxiliary_hooks_domain }}/health"
        status_code: 200
      register: auxiliary_health
      until: auxiliary_health is succeeded
      retries: 3
      delay: 5

    - name: Сертификат домена вебхуков выдан Let's Encrypt на этот домен
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          echo | openssl s_client -connect {{ auxiliary_hooks_domain }}:443 -servername {{ auxiliary_hooks_domain }} 2>/dev/null
          | grep -E '^(issuer|subject)='
        executable: /bin/bash
      register: auxiliary_cert
      changed_when: false
      failed_when: >-
        auxiliary_cert.rc != 0
        or auxiliary_cert.stdout is not search("Encrypt|ISRG")
        or auxiliary_cert.stdout is not search(auxiliary_hooks_domain | regex_escape)

    - name: "Снаружи закрыты внутренний порт сервиса и Docker API"
      ansible.builtin.wait_for:
        host: "{{ auxiliary_hooks_domain }}"
        port: "{{ item }}"
        state: stopped
        connect_timeout: 3
        timeout: 10
        msg: "На {{ auxiliary_hooks_domain }} снаружи открыт {{ item }}/tcp"
      loop: ["{{ auxiliary_hooks_port | int }}", 2375, 2376]
