---
- name: "Проверки с управляющей машины"
  hosts: localhost
  gather_facts: false
  vars:
    public_ip: "{{ hostvars[groups['gateway'][0]]['ansible_host'] }}"
  tasks:
    # Inventory строится из серверов проекта (openstack.yml) — один хост означает,
    # что второй сервер в проекте не осталось.
    - name: В проекте ровно одна VPS
      ansible.builtin.assert:
        that:
          - groups['gateway'] | length == 1
          - groups['all'] | length == 1
        fail_msg: "Ожидалась одна VPS, в inventory: {{ groups['all'] }}"

    # Caddy отдаёт корневой index.html бакета релизов клиента. До первой выкатки клиента файла
    # в бакете нет, и хранилище отвечает 404 — стенд при этом настроен верно.
    - name: HTTPS на домене отвечает
      ansible.builtin.uri:
        url: "https://{{ app_domain }}/"
        status_code: [200, 404]
        return_content: true
      register: https_ok
      until: https_ok is succeeded
      retries: 5
      delay: 5

    - name: Ответ пришёл из бакета релизов и не кэшируется
      ansible.builtin.assert:
        that:
          - https_ok.cache_control | default('') == 'no-cache'
          - https_ok.status == 404 or https_ok.content is search('<meta name="release"')
        fail_msg: >-
          Домен {{ app_domain }} отвечает не index.html клиента:
          статус {{ https_ok.status }}, Cache-Control {{ https_ok.cache_control | default('нет') }}

    - name: Клиент ещё не выкатан
      ansible.builtin.debug:
        msg: "В бакете нет index.html: {{ app_domain }} отвечает 404 до первой выкатки клиента"
      when: https_ok.status == 404

    # Прямой заход на маршрут SPA: тот же index.html, а не 404 от несуществующего ключа
    - name: Вложенный маршрут отдаёт тот же ответ
      ansible.builtin.uri:
        url: "https://{{ app_domain }}/notebooks/verify"
        status_code: [200, 404]
        return_content: true
      register: spa_route
      failed_when: spa_route.status != https_ok.status or spa_route.content != https_ok.content

    # Путь API не должен проваливаться в index.html клиента
    - name: Путь API не отдаёт клиент
      ansible.builtin.uri:
        url: "https://{{ app_domain }}/api/v1/verify"
        status_code: [200, 401, 403, 404, 503]
        return_content: true
      register: api_route
      failed_when: api_route.content is search('<meta name="release"')

    - name: Выдать информацию о сертификате
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          echo | openssl s_client -connect {{ app_domain }}:443 -servername {{ app_domain }} 2>/dev/null
          | grep -E '^(issuer|subject)='
        executable: /bin/bash
      register: cert_info
      changed_when: false

    - name: Сертификат выдан Let's Encrypt
      ansible.builtin.assert:
        that: cert_info.stdout is search("Encrypt|ISRG")
        fail_msg: "Сертификат не от Let's Encrypt: {{ cert_info.stdout }}"

    - name: "На публичном IP открыты 22/80/443"
      ansible.builtin.wait_for:
        host: "{{ public_ip }}"
        port: "{{ item }}"
        timeout: 10
      loop: [22, 80, 443]

    # Наружу должен смотреть только Caddy (и ssh). Postgres/Go API в Compose не публикуются,
    # Docker API (2375/2376) по умолчанию выключен. Проба с управляющей машины ловит и
    # порты, которые Docker открыл в обход ufw (DNAT раньше INPUT): доходит до хоста,
    # где docker-proxy слушает на 0.0.0.0.
    - name: "На публичном IP закрыты 5432, 8080, 2375, 2376"
      ansible.builtin.wait_for:
        host: "{{ public_ip }}"
        port: "{{ item }}"
        state: stopped
        connect_timeout: 3
        timeout: 10
        msg: "На публичном IP {{ public_ip }} принимает соединения {{ item }}/tcp"
      loop: [5432, 8080, 2375, 2376]

- name: "Проверки на VPS"
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Правила ufw
      ansible.builtin.command: ufw status verbose
      register: ufw_status
      changed_when: false

    - name: Разрешающие правила ufw
      ansible.builtin.set_fact:
        ufw_allow_rules: "{{ ufw_status.stdout_lines | select('search', ' ALLOW ') | list }}"

    # ufw на Anywhere заводит по строке на family (v4+v6), сравниваем уникальные порт/прото.
    # Первое слово строки без обратных слешей: их экранирование в шаблонах разное в версиях ansible-core.
    - name: Порт/прото разрешённых правил ufw и ожидаемых из firewall_rules
      ansible.builtin.set_fact:
        ufw_allow_ports: >-
          {{ ufw_allow_rules | map('regex_search', '^[^ ]+') | unique | sort | list }}
        expected_allow_ports: >-
          {{ firewall_rules | map(attribute='port') | zip(firewall_rules | map(attribute='proto'))
             | map('join', '/') | sort | list }}

    - name: "UFW: активен, входящие запрещены, разрешающих правил ровно {{ firewall_rules | length }}"
      ansible.builtin.assert:
        that:
          - "ufw_status.stdout is search('(?m)^Status: active$')"
          - ufw_status.stdout is search('deny [(]incoming[)]')
          - ufw_allow_ports == expected_allow_ports
        fail_msg: "ufw: {{ ufw_status.stdout }}; разрешено: {{ ufw_allow_ports }}, ждали: {{ expected_allow_ports }}"

    - name: "UFW: разрешено порт/прото {{ item.port ~ '/' ~ item.proto }}"
      ansible.builtin.assert:
        that: >-
          ufw_allow_rules
          | select('search', '^' ~ item.port ~ '/' ~ item.proto ~ '[ ]+ALLOW IN')
          | list | length > 0
        fail_msg: "{{ ufw_status.stdout }}"
      loop: "{{ firewall_rules }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Эффективный конфиг sshd (sshd -T)
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          sshd -T | grep -E
          '^(permitrootlogin|passwordauthentication|kbdinteractiveauthentication|allowtcpforwarding) '
        executable: /bin/bash
      register: sshd_effective
      changed_when: false

    - name: "Hardening активен: root/пароли выключены, форвардинг запрещён (jump-хост не нужен)"
      ansible.builtin.assert:
        that:
          - sshd_effective.stdout is search('(?m)^permitrootlogin no$')
          - sshd_effective.stdout is search('(?m)^passwordauthentication no$')
          - sshd_effective.stdout is search('(?m)^kbdinteractiveauthentication no$')
          - sshd_effective.stdout is search('(?m)^allowtcpforwarding no$')
        fail_msg: "sshd -T: {{ sshd_effective.stdout }}"

    # Какие TCP-порты слушает не на loopback: publishing-порты Docker смотрят прямо наружу
    # мимо ufw — проверяем, что вне allowlist (22/80/443) слушающего нет.
    - name: Слушающие TCP-порты (кроме loopback)
      ansible.builtin.shell:
        cmd: |
          python3 - <<'EOF'
          import json, subprocess
          out = subprocess.run(["ss", "-Hltn"], capture_output=True, text=True, check=True).stdout
          ports = set()
          for line in out.splitlines():
              addr, _, port = line.split()[3].rpartition(":")
              if addr.startswith("127.") or addr == "[::1]" or "%lo" in addr:
                  continue
              ports.add(int(port))
          print(json.dumps(sorted(ports)))
          EOF
        executable: /bin/bash
      register: host_listen
      changed_when: false

    - name: "Слушаются только порты из allowlist {{ firewall_rules | map(attribute='port') | list }}"
      ansible.builtin.assert:
        that: >-
          (host_listen.stdout | from_json)
          | difference(firewall_rules | map(attribute='port') | map('int') | list) | length == 0
        fail_msg: "Слушаются порты {{ host_listen.stdout }} — наружу смотрит лишнее (Docker -p?)"
