---
# Агент в режиме ожидания: wheel из образа Go API (версия и sha256 — от backend), venv, agent.env, unit проекта.
- name: Create the kernel workspace group
  ansible.builtin.group:
    name: cellestial-workspace
    gid: 65532
    system: true

- name: Agent account
  ansible.builtin.user:
    name: "{{ runtime_agent_user }}"
    system: true
    create_home: false
    home: /nonexistent
    groups:
      - docker
      - cellestial-workspace
    append: true
    shell: /usr/sbin/nologin
  register: runtime_agent_account

# Kernel получает только data. setgid сохраняет общую группу для новых подкаталогов.
- name: Prepare the shared kernel workspace directory
  ansible.builtin.file:
    path: /srv/cellestial/workspace/data
    state: directory
    owner: "{{ runtime_agent_user }}"
    group: "65532"
    mode: "2770"
    follow: false

- name: Prepare the private upload staging directory
  ansible.builtin.file:
    path: /srv/cellestial/workspace/staging
    state: directory
    owner: "{{ runtime_agent_user }}"
    mode: "0700"
    follow: false

- name: Agent installation and configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ runtime_agent_home }}"
    - "{{ runtime_agent_config_dir }}"

# Образ runtime содержит wheel и venv своего релиза backend: при том же wheel установка не нужна
- name: Copy the agent wheel
  ansible.builtin.copy:
    src: "{{ agent_wheel }}"
    dest: "{{ runtime_agent_home }}/{{ agent_wheel | basename }}"
    owner: root
    group: root
    mode: "0644"
  register: runtime_agent_wheel_copy

- name: Read the checksum of the copied wheel
  ansible.builtin.stat:
    path: "{{ runtime_agent_home }}/{{ agent_wheel | basename }}"
    checksum_algorithm: sha256
  register: runtime_agent_wheel

- name: The wheel matches the checksum from the backend
  ansible.builtin.assert:
    that:
      - runtime_agent_wheel.stat.checksum == agent_wheel_sha256
    fail_msg: "{{ agent_wheel | basename }} does not match agent_wheel_sha256; refusing to install it."

# Образ уже содержит venv с этим файлом: зависимости — только если backend прислал другие
- name: Copy the pinned agent requirements
  ansible.builtin.copy:
    src: "{{ agent_requirements }}"
    dest: "{{ runtime_agent_home }}/requirements.txt"
    owner: root
    group: root
    mode: "0644"
  register: runtime_agent_requirements

# Не handler: зависимости нужны до установки wheel и старта агента в этом же запуске
- name: Install the agent requirements into the virtualenv  # noqa: no-handler
  when: runtime_agent_requirements is changed
  ansible.builtin.pip:
    requirements: "{{ runtime_agent_home }}/requirements.txt"
    virtualenv: "{{ runtime_agent_home }}/venv"
    virtualenv_command: /usr/bin/python3 -m venv

# Зависимости — только закреплённые в requirements.txt; заново — и после новых зависимостей.
# --force-reinstall: wheel с прежними именем и версией, но другими байтами pip иначе пропустит
- name: Install the agent wheel  # noqa: no-handler
  when: runtime_agent_wheel_copy is changed or runtime_agent_requirements is changed
  ansible.builtin.pip:
    name: "{{ runtime_agent_home }}/{{ agent_wheel | basename }}"
    virtualenv: "{{ runtime_agent_home }}/venv"
    extra_args: --no-deps --force-reinstall

- name: Write the agent settings without a session
  ansible.builtin.template:
    src: agent.env.j2
    dest: "{{ runtime_agent_env_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Install the agent service unit of the project
  ansible.builtin.copy:
    src: "{{ agent_service }}"
    dest: /etc/systemd/system/{{ runtime_agent_service }}.service
    owner: root
    group: root
    mode: "0644"

- name: Agent unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/{{ runtime_agent_service }}.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: The agent starts only with the kernel network firewall
  ansible.builtin.template:
    src: firewall-dropin.conf.j2
    dest: /etc/systemd/system/{{ runtime_agent_service }}.service.d/10-cellestial-firewall.conf
    owner: root
    group: root
    mode: "0644"

- name: Require the workspace mount before starting the agent
  ansible.builtin.template:
    src: workspace-dropin.conf.j2
    dest: /etc/systemd/system/{{ runtime_agent_service }}.service.d/20-cellestial-workspace.conf
    owner: root
    group: root
    mode: "0644"

# Плейбук идёт на свежей VPS до назначения сессии; при сбое Go API удаляет VPS, а не повторяет плейбук
- name: Start the agent
  ansible.builtin.systemd_service:
    name: "{{ runtime_agent_service }}"
    daemon_reload: true
    enabled: true
    # Уже запущенный процесс получает новые группы только после рестарта.
    state: "{{ 'restarted' if runtime_agent_account is changed else 'started' }}"

- name: The agent listens on loopback
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ runtime_agent_port }}"
    timeout: 60

- name: Read the running agent PID  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl show --property=MainPID --value {{ runtime_agent_service }}.service
  register: runtime_agent_main_pid
  changed_when: false
  failed_when: runtime_agent_main_pid.rc != 0 or runtime_agent_main_pid.stdout is not match('^[1-9][0-9]*$')

- name: Read the kernel credentials of the running agent
  ansible.builtin.slurp:
    src: /proc/{{ runtime_agent_main_pid.stdout }}/status
  register: runtime_agent_process_status

- name: Verify the running agent can use the kernel workspace group
  ansible.builtin.assert:
    that:
      - >-
        ((runtime_agent_process_status.content | b64decode).splitlines()
        | select('match', '^Groups:') | first).split()[1:] | select('equalto', '65532') | list | length == 1
    fail_msg: The running runtime agent is missing supplementary GID 65532.
