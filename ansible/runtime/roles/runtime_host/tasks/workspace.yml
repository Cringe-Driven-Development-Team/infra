---
- name: Validate the runtime workspace size
  ansible.builtin.assert:
    that:
      - runtime_host_workspace_size_gib | string is match('^[1-9][0-9]*$')
    fail_msg: runtime_host_workspace_size_gib must be a positive integer in GiB.

- name: Create the runtime workspace directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /srv/cellestial, mode: "0755" }
    - { path: /var/lib/cellestial-workspace, mode: "0700" }

- name: Inspect the runtime workspace mount
  ansible.builtin.command: findmnt --noheadings --mountpoint /srv/cellestial/workspace
  register: runtime_host_workspace_mount
  changed_when: false
  failed_when: runtime_host_workspace_mount.rc not in [0, 1]

- name: Create the unmounted workspace mountpoint
  ansible.builtin.file:
    path: /srv/cellestial/workspace
    state: directory
    owner: root
    group: root
    mode: "0000"
  when: runtime_host_workspace_mount.rc == 1

- name: Install the runtime workspace preparation script
  ansible.builtin.copy:
    src: prepare-workspace.sh
    dest: /usr/local/sbin/cellestial-prepare-workspace
    owner: root
    group: root
    mode: "0755"

- name: Allocate and validate the workspace backing filesystem
  ansible.builtin.command: /usr/local/sbin/cellestial-prepare-workspace {{ runtime_host_workspace_size_gib }}
  register: runtime_host_workspace_preparation
  changed_when: "'Created workspace filesystem' in runtime_host_workspace_preparation.stdout"

- name: Install the persistent workspace mount unit
  ansible.builtin.copy:
    src: srv-cellestial-workspace.mount
    dest: /etc/systemd/system/srv-cellestial-workspace.mount
    owner: root
    group: root
    mode: "0644"

- name: Mount the workspace and enable it at boot
  ansible.builtin.systemd_service:
    name: srv-cellestial-workspace.mount
    daemon_reload: true
    enabled: true
    state: started

- name: Verify the mounted workspace matches the backing file
  ansible.builtin.command: /usr/local/sbin/cellestial-prepare-workspace --verify-mount
  changed_when: false

- name: Set kernel ownership on the workspace
  ansible.builtin.file:
    path: /srv/cellestial/workspace
    state: directory
    owner: "65532"
    group: "65532"
    mode: "0755"
