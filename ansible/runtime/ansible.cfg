# Плейбук runtime-VPS запускает Go API на VPS2 (backend internal/runtime/adapters/ansible): cwd —
# этот каталог, inventory.json и vars.json — временные файлы операции (0600). ANSIBLE_SSH_ARGS задаёт
# runner: known_hosts операции и StrictHostKeyChecking=yes.
[defaults]
host_key_checking = True
retry_files_enabled = False
roles_path = ./roles
interpreter_python = /usr/bin/python3
# Пользователь app контейнера Go API без домашнего каталога: временные файлы Ansible — в writable
# каталоге заданий (RUNTIME_WORK_DIR)
local_tmp = /var/lib/cellestial/runtime/.ansible/tmp

[ssh_connection]
pipelining = True
control_path_dir = /var/lib/cellestial/runtime/.ansible/cp
