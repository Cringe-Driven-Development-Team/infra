---
# Перенос Postgres с gateway на приватную VPS2 (infra#59). Порядок, окно и откат — RUNBOOK.md,
# «Перенос Go и Postgres на VPS2». Плейбук только копирует и сверяет данные: Go на gateway
# останавливается (сайт отвечает 503), на VPS2 поднимается Go того же тега с восстановленной базой.
# Gateway на раздельную раскладку переключает следующий шаг — deploy-bff.yml -e app_backend_split=true.
# Данные и том Postgres на gateway не удаляются.
#
#   ansible-playbook -i inventory/ci.yml migrate-backend.yml -e migrate_confirm=yes
- name: Prepare the migration
  hosts: gateway
  become: true
  gather_facts: false
  vars:
    migrate_dump: "{{ app_compose_dir }}/backup/postgres-migrate.dump"
    migrate_counts_sql: >-
      SELECT format('SELECT %L || '' '' || count(*) || '' '' ||
      coalesce(md5(string_agg(t::text, '','' ORDER BY t::text)), ''-'') FROM %I.%I t',
      schemaname || '.' || tablename, schemaname, tablename)
      FROM pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
      ORDER BY schemaname, tablename \gexec
  tasks:
    - name: Require an explicit migration window and both hosts
      ansible.builtin.assert:
        that:
          - migrate_confirm | default('') == 'yes'
          - groups['gateway'] | length == 1
          - groups.get('backend', []) | length == 1
          - not app_backend_split
        fail_msg: >-
          Run with -e migrate_confirm=yes during the agreed window, with one gateway and one backend in
          the inventory and app_backend_split still false (the data is still on the gateway).

    # запрос сверки нужен и плею VPS2: факт хоста виден ему через hostvars
    - name: Remember the table check
      ansible.builtin.set_fact:
        migrate_tables_sql: "{{ migrate_counts_sql }}"

    - name: Read the deployed environment
      ansible.builtin.slurp:
        src: "{{ app_compose_dir }}/.env"
      register: migrate_env
      no_log: true

    - name: Backend image tag on the gateway
      ansible.builtin.set_fact:
        migrate_backend_tag: >-
          {{ migrate_env.content | b64decode
          | regex_findall('(?m)^BACKEND_IMAGE_TAG=(sha-[0-9a-f]{7,40})$') | first | default('') }}

    - name: The gateway runs a deployed backend
      ansible.builtin.assert:
        that:
          - migrate_backend_tag | length > 0
        fail_msg: No BACKEND_IMAGE_TAG in the gateway .env — nothing to migrate.

    # Go останавливается, чтобы данные не менялись после снимка; Postgres продолжает работать
    - name: Stop the Go API on the gateway
      ansible.builtin.command:
        argv: [docker, compose, stop, api]
        chdir: "{{ app_compose_dir }}"
      changed_when: true

    - name: Backup directory
      ansible.builtin.file:
        path: "{{ app_compose_dir }}/backup"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Dump the database
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          docker compose exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc'
          > {{ migrate_dump }}
        chdir: "{{ app_compose_dir }}"
        executable: /bin/bash
      changed_when: true

    - name: Count and checksum every table on the gateway
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - exec
          - -T
          - postgres
          - sh
          - -c
          - psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -v ON_ERROR_STOP=1
        stdin: "{{ migrate_counts_sql }}"
        chdir: "{{ app_compose_dir }}"
      register: migrate_source_tables
      changed_when: false

    - name: Copy the dump to the controller
      ansible.builtin.fetch:
        src: "{{ migrate_dump }}"
        dest: "{{ migrate_local_dir | default(playbook_dir ~ '/.migrate') }}/postgres-migrate.dump"
        flat: true

- name: Restore on VPS2
  hosts: backend
  become: true
  gather_facts: false
  vars:
    app_deploy_service: api
    app_backend_split: true
    backend_image_tag: "{{ hostvars[groups['gateway'][0]]['migrate_backend_tag'] }}"
    migrate_dump: "{{ app_compose_dir }}/backup/postgres-migrate.dump"
  tasks:
    - name: Gather server facts
      ansible.builtin.setup:

    # Сначала только Postgres и Redis: база восстанавливается до первого запуска Go
    - name: Start Postgres and Redis of VPS2
      ansible.builtin.include_role:
        name: app
      vars:
        app_start_only: [postgres, redis]

    - name: Refuse a non-empty database
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - exec
          - -T
          - postgres
          - sh
          - -c
          - >-
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -c
            "SELECT count(*) FROM pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema')"
        chdir: "{{ app_compose_dir }}"
      register: migrate_target_existing
      changed_when: false
      failed_when: migrate_target_existing.rc != 0 or migrate_target_existing.stdout | trim != '0'

    - name: Backup directory
      ansible.builtin.file:
        path: "{{ app_compose_dir }}/backup"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Copy the dump to VPS2
      ansible.builtin.copy:
        src: "{{ migrate_local_dir | default(playbook_dir ~ '/.migrate') }}/postgres-migrate.dump"
        dest: "{{ migrate_dump }}"
        owner: root
        group: root
        mode: "0600"

    - name: Restore the database
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          docker compose exec -T postgres sh -c
          'pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --no-owner --exit-on-error'
          < {{ migrate_dump }}
        chdir: "{{ app_compose_dir }}"
        executable: /bin/bash
      changed_when: true

    - name: Count and checksum every table on VPS2
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - exec
          - -T
          - postgres
          - sh
          - -c
          - psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -v ON_ERROR_STOP=1
        stdin: "{{ hostvars[groups['gateway'][0]]['migrate_tables_sql'] }}"
        chdir: "{{ app_compose_dir }}"
      register: migrate_target_tables
      changed_when: false

    - name: Every table and migration row is the same
      ansible.builtin.assert:
        that:
          - migrate_target_tables.stdout_lines == hostvars[groups['gateway'][0]]['migrate_source_tables'].stdout_lines
          - migrate_target_tables.stdout_lines | length > 0
        fail_msg: >-
          Tables differ after restore. Gateway: {{ hostvars[groups['gateway'][0]]['migrate_source_tables'].stdout_lines
          | map('regex_replace', ' [0-9a-f-]+$', '') | list }}; VPS2: {{ migrate_target_tables.stdout_lines
          | map('regex_replace', ' [0-9a-f-]+$', '') | list }}. Go on the gateway is stopped: start it again
          (RUNBOOK, rollback) or fix and repeat.
        success_msg: "{{ migrate_target_tables.stdout_lines | length }} tables match by row count and content"

    - name: Start the Go API of the same tag on VPS2
      ansible.builtin.include_role:
        name: app

    - name: Go answers on the private address
      ansible.builtin.uri:
        url: "http://{{ app_backend_address }}:8080/health"
      delegate_to: "{{ groups['gateway'][0] }}"

    # копия с данными пользователей на управляющей машине больше не нужна: дамп остаётся на обеих VPS
    - name: Remove the dump from the controller
      ansible.builtin.file:
        path: "{{ migrate_local_dir | default(playbook_dir ~ '/.migrate') }}"
        state: absent
      delegate_to: localhost
      become: false
