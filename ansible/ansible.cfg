[defaults]
inventory = inventory
host_key_checking = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# IdentitiesOnly: только ключ стенда (ansible_ssh_private_key_file), без перебора ключей
# агента — после ssh_hardening sshd даёт MaxAuthTries 4.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes
