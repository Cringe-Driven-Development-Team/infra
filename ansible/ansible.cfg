[defaults]
inventory = inventory/openstack.yml
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# IdentitiesOnly: только ключ стенда (ansible_ssh_private_key_file), без перебора ключей
# агента — после ssh_hardening sshd даёт MaxAuthTries 4.
# accept-new вместо отключения проверки: новые хосты заносятся в known_hosts,
# изменение ключа уже известного хоста — ошибка, а не молчаливый skip.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
