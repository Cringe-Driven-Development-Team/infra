---
# Go API приватный: после запуска проверяются образ и внутренний HTTPS с gateway.
# Выкатка и ручной откат используют один digest-ref; BFF остаётся на своём образе.
# Go — на приватной VPS2. Gateway участвует только в делегированных HTTP/SSH-проверках.
- name: Validate backend deployment inventory
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  tasks:
    - name: Require one gateway and a private backend VPS
      ansible.builtin.assert:
        that:
          - groups['gateway'] | length == 1
          - groups.get('backend', []) | length == 1
        fail_msg: >-
          Supply backend_image_ref=<image>@sha256:<digest> and an inventory with one gateway and one backend VPS.
      tags: validation

- name: Reject deployment of the monolith after the microservices cutover
  hosts: backend
  become: true
  gather_facts: false
  tasks:
    - name: Read the microservices cutover marker
      ansible.builtin.stat:
        path: "{{ app_compose_dir | default('/opt/cellestial') }}/microservices/v2-active"
      register: backend_v2_marker
      tags: validation

    - name: The legacy deployment is only valid before the microservices cutover
      ansible.builtin.assert:
        that: not backend_v2_marker.stat.exists
        fail_msg: Microservices cutover protects the database. Consult the verified restore procedure in RUNBOOK.md.
      tags: validation

# Проверки Go идут с gateway сертификатом BFF (infra#160): он должен быть выпущен до них
- name: BFF client certificate on the gateway
  hosts: gateway
  become: true
  gather_facts: false
  vars_files:
    - roles/app/defaults/main.yml
  tasks:
    - name: Issue or renew the BFF client certificate
      ansible.builtin.include_tasks: roles/app/tasks/mtls-cert.yml
  handlers:
    - name: Load the application handlers
      ansible.builtin.import_tasks: roles/app/handlers/main.yml

- name: Deploy backend
  hosts: backend
  become: true
  gather_facts: false
  vars:
    app_deploy_service: api
  pre_tasks:
    - name: Validate before changing the server
      ansible.builtin.import_tasks: roles/app/tasks/validate.yml
      tags: validation

    - name: Pull the backend before changing server configuration
      ansible.builtin.import_tasks: roles/app/tasks/pull-image.yml

    - name: Gather server facts
      ansible.builtin.setup:
  roles:
    - app
  post_tasks:
    - name: Check the selected backend container
      ansible.builtin.import_tasks: roles/app/tasks/check-backend-image.yml
      vars:
        backend_check_ref: "{{ backend_image_ref }}"

    - name: Remember the private backend address before delegation
      ansible.builtin.set_fact:
        backend_probe_address: "{{ app_backend_address }}"

    - name: Check the Go API from the gateway
      ansible.builtin.import_tasks: roles/app/tasks/probe-backend.yml
