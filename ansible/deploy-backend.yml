---
# Go API снаружи не публикуется (infra#58): готовность — healthcheck Compose, пользовательский путь
# проверяет deploy-bff.yml. BFF, если выкачен, остаётся на своём теге.
- name: Deploy backend to the single VPS
  hosts: gateway
  become: true
  gather_facts: false
  vars:
    app_deploy_service: api
    app_deploy_tag: backend_image_tag
  pre_tasks:
    - name: Require exactly one deployment host
      ansible.builtin.assert:
        that:
          - groups['gateway'] | length == 1
          - ansible_play_hosts_all | length == 1
        fail_msg: Supply backend_image_tag=sha-<commit> and an inventory with one gateway.
      tags: validation

    - name: Validate before changing the server
      ansible.builtin.import_tasks: roles/app/tasks/validate.yml
      tags: validation

    - name: Gather server facts
      ansible.builtin.setup:
  roles:
    - caddy
    - app
