---
# Базовая настройка VPS: пользователь уже создан bootstrap.yml, дальше deploy + sudo.
# users — и здесь: ключи команды (files/authorized_keys/*.pub) раскатываются каждым site.yml,
# bootstrap.yml после ssh_hardening повторно не запустить (root-логин закрыт).
- name: "Базовая настройка VPS"
  hosts: gateway
  become: true
  roles:
    - users
    - common
    - ssh_hardening
    - firewall
    - docker
    - caddy

# Приватная VPS2 (infra#59): то же, кроме Caddy; доступ — через gateway (group_vars/backend).
# Gateway настраивается первым: на ней sshd разрешает пересылку к VPS2 (ssh_hardening_jump_targets).
- name: "Базовая настройка приватной VPS2"
  hosts: backend
  become: true
  roles:
    - users
    - common
    - ssh_hardening
    - firewall
    - docker
