deploy_user: deploy

# Ключ стенда: ssh-keygen -t ed25519 -f ~/.ssh/selectel_release -N ""
# Его публичная часть уходит в Pulumi как infra:sshPublicKey (keypair единственной VPS).
deploy_key_path: "{{ lookup('env', 'HOME') }}/.ssh/selectel_release"
ansible_user: "{{ deploy_user }}"
ansible_ssh_private_key_file: "{{ deploy_key_path }}"

# Домен VPS (A-запись под управлением Pulumi: infra:domain)
app_domain: cellestial.ru

# Origin'ы, которым Go API подтверждает CORS (CORS_ALLOWED_ORIGINS в .env бэка): на проде — только
# свой домен. Без переменной бэк берёт дефолт из кода, а в нём есть http://localhost:5173.
app_cors_allowed_origins: https://cellestial.ru

# Домен CDN бакета релизов (pulumi stack output cdnCustomDomain): с него браузер грузит чанки
# releases/{sha}/. При пересоздании стека и бакета не меняется.
frontend_cdn_domain: cdn.cellestial.ru
# Домен статики продукта (pulumi stack output staticCustomDomain): картинки и шрифты клиента.
# Вместе с frontend_cdn_domain и avatars_public_domain входит в Content-Security-Policy.
frontend_static_domain: static.cellestial.ru
# Content-Security-Policy на ответах BFF (HTML клиента). true — заголовок Content-Security-Policy-Report-Only:
# браузер пишет нарушения в консоль и ничего не блокирует. false — политика применяется.
# Переключать после прохода по экранам прода без нарушений; verify.yml ждёт тот же заголовок.
caddy_csp_report_only: true

# Пользователи в группе docker (эквивалент root на хосте)
docker_users:
  - "{{ deploy_user }}"

# Раскладка приложения (infra#59). false — всё на gateway (Caddy, BFF, Go API, Postgres, Redis в одном
# проекте Compose). true — на gateway Caddy и BFF, на приватной VPS2 (группа backend) Go API, Postgres и
# Redis; BFF ходит в Go по приватному адресу. Данные не переносятся: на VPS2 новая пустая база.
# Переключение и откат — RUNBOOK.md, «Go и Postgres на VPS2».
app_backend_split: false
# Приватный адрес VPS2 (выход Pulumi backendPrivateIp): из inventory, где он ansible_host группы backend
app_backend_address: "{{ hostvars[groups['backend'][0]]['ansible_host'] if groups.get('backend') else '' }}"
# Приватный адрес gateway (выход Pulumi gatewayPrivateIp): только с него VPS2 пускает SSH и Go API
app_gateway_address: 192.168.199.225
# Проект Docker Compose на VPS (схема MVP: Caddy, Go API, Postgres в одном проекте).
# Общий для роли caddy и будущей роли приложения — сервисы лягут в один compose.yml.
app_compose_dir: /opt/cellestial

# Секреты выкатки: значения — в vault.yml рядом (ansible-vault, префикс vault_).
# Роли и шаблоны используют только открытые имена.
postgres_password: "{{ vault_postgres_password }}"
# Пароль Redis (infra#46): одной строкой из [A-Za-z0-9_-] — он попадает в redis.conf как есть
redis_password: "{{ vault_redis_password }}"
jwt_secret: "{{ vault_jwt_secret }}"
csrf_secret: "{{ vault_csrf_secret }}"
# BFF (infra#58): ключ сессии — base64 ровно 32 байт (openssl rand -base64 32), один на выпуск и откат;
# S2S-ключ — один для BFF (BFF_KEY) и Go (BFF_API_KEY), [A-Za-z0-9_-] от 32 символов
session_key: "{{ vault_session_key }}"
bff_api_key: "{{ vault_bff_api_key }}"
# S3-ключ Go API к бакетам ноутбуков и аватарок (выходы Pulumi notebooksAccessKey / notebooksSecretKey)
notebooks_s3_access_key: "{{ vault_notebooks_s3_access_key }}"
notebooks_s3_secret_key: "{{ vault_notebooks_s3_secret_key }}"

# Несекретные параметры S3 для Go API — значения из Pulumi (cd pulumi && pulumi stack output).
s3_endpoint: https://s3.ru-7.storage.selcloud.ru   # выход s3Endpoint
s3_region: ru-7                                    # infra:s3Pool, он же регион подписи
s3_force_path_style: true                          # S3-клиент бэка — path-style
notebooks_bucket: cellestial-notebooks-0           # выход notebooksBucket
avatars_bucket: cellestial-avatars-0               # выход avatarsBucket
# Публичный URL аватарки — https://<avatars_public_domain>/<ключ>: свой домен бакета (выход
# avatarsCustomDomain), при пересоздании стека не меняется. Сертификат домена выпущен в панели;
# технический <uuid>.selstorage.ru — выход avatarsPublicDomain.
avatars_public_domain: avatars.cellestial.ru
