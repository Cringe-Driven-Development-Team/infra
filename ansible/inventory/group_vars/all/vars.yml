deploy_user: deploy

# Ключ стенда: ssh-keygen -t ed25519 -f ~/.ssh/selectel_release -N ""
# Его публичная часть уходит в Pulumi как infra:sshPublicKey (keypair единственной VPS).
deploy_key_path: "{{ lookup('env', 'HOME') }}/.ssh/selectel_release"
ansible_user: "{{ deploy_user }}"
ansible_ssh_private_key_file: "{{ deploy_key_path }}"

# Домен VPS (A-запись под управлением Pulumi: infra:domain)
app_domain: cellestial.ru

# Origin'ы, которым Go API подтверждает CORS (CORS_ALLOWED_ORIGINS в .env бэка): на проде — только
# свой домен. Без переменной бэк берёт дефолт из кода, а в нём есть http://localhost:5173.
app_cors_allowed_origins: https://cellestial.ru

# Домен CDN бакета релизов (pulumi stack output cdnCustomDomain): с него браузер грузит чанки
# releases/{sha}/. При пересоздании стека и бакета не меняется.
frontend_cdn_domain: cdn.cellestial.ru
# Домен статики продукта (pulumi stack output staticCustomDomain): картинки и шрифты клиента.
# Вместе с frontend_cdn_domain и avatars_public_domain входит в Content-Security-Policy.
frontend_static_domain: static.cellestial.ru
# Content-Security-Policy на ответах BFF (HTML клиента). true — заголовок Content-Security-Policy-Report-Only:
# браузер пишет нарушения в консоль и ничего не блокирует. false — политика применяется.
# verify.yml ждёт тот же заголовок. Новый источник ресурсов у клиента — сначала правка политики в Caddyfile.j2.
caddy_csp_report_only: false

# Пользователи в группе docker (эквивалент root на хосте)
docker_users:
  - "{{ deploy_user }}"

# Приложение закреплено: Caddy/BFF на gateway, Go API/Postgres/Redis на приватной VPS2.
# Приватный адрес VPS2 (выход Pulumi backendPrivateIp): из inventory, где он ansible_host группы backend
app_backend_address: "{{ hostvars[groups['backend'][0]]['ansible_host'] if groups.get('backend') else '' }}"
# Приватный адрес gateway (выход Pulumi gatewayPrivateIp): только с него VPS2 пускает SSH и Go API
app_gateway_address: 192.168.199.225
# Одинаковый путь проекта Docker Compose на gateway и VPS2; на каждом хосте только его сервисы.
app_compose_dir: /opt/cellestial

# Секреты выкатки: значения — в vault.yml рядом (ansible-vault, префикс vault_).
# Роли и шаблоны используют только открытые имена.
postgres_password: "{{ vault_postgres_password }}"
# Пароль Redis (infra#46): одной строкой из [A-Za-z0-9_-] — он попадает в redis.conf как есть
redis_password: "{{ vault_redis_password }}"
jwt_secret: "{{ vault_jwt_secret }}"
csrf_secret: "{{ vault_csrf_secret }}"
# Постоянный ключ шифрования TOTP (base64 32 байт); хранить вместе с резервной копией БД.
totp_encryption_key: "{{ vault_totp_encryption_key }}"
# BFF (infra#58): ключ сессии — base64 ровно 32 байт (openssl rand -base64 32), один на выпуск и откат;
# S2S-ключ — один для BFF (BFF_KEY) и Go (BFF_API_KEY), [A-Za-z0-9_-] от 32 символов
session_key: "{{ vault_session_key }}"
bff_api_key: "{{ vault_bff_api_key }}"
# S3-ключ Go API к бакету аватарок (выходы Pulumi avatarsAccessKey / avatarsSecretKey)
avatars_s3_access_key: "{{ vault_avatars_s3_access_key }}"
avatars_s3_secret_key: "{{ vault_avatars_s3_secret_key }}"

# Несекретные параметры S3 для Go API — значения из Pulumi (cd pulumi && pulumi stack output).
s3_endpoint: https://s3.ru-7.storage.selcloud.ru   # выход s3Endpoint
s3_region: ru-7                                    # infra:s3Pool, он же регион подписи
s3_force_path_style: true                          # S3-клиент бэка — path-style
avatars_bucket: cellestial-avatars-0               # выход avatarsBucket
# Публичный URL аватарки — https://<avatars_public_domain>/<ключ>: свой домен бакета (выход
# avatarsCustomDomain), при пересоздании стека не меняется. Сертификат домена выпущен в панели;
# технический <uuid>.selstorage.ru — выход avatarsPublicDomain.
avatars_public_domain: avatars.cellestial.ru

# Runtime-VPS пользовательских сессий (infra#89, backend#57): Go API на VPS2 сам создаёт, настраивает
# (ansible/runtime) и удаляет VPS на сессию. Значения — выходы Pulumi runtime* (RUNBOOK.md, «Runtime-VPS»).
# Все обязательны для backend-деплоя (vault_runtime_* — тоже); security group runtime пускает SSH
# и 8443 лишь с VPS2.
runtime_provider: openstack
runtime_os_auth_url: https://cloud.api.selcloud.ru/identity/v3
runtime_os_username: cellestialRuntimeProvisioner                # выход runtimeOsUsername
runtime_os_user_domain_name: "631994"                            # выход runtimeAccountId
runtime_os_project_id: 55bd6170b9584be1832d5eec4b8ed6f9          # выход runtimeProjectId
runtime_os_region: ru-9                                          # выход runtimeRegion
runtime_availability_zone: ru-9a                                 # выход runtimeAvailabilityZone
runtime_network_id: c173bf61-fb03-4988-bf5b-bd3c294b49ad         # выход runtimeNetworkId
runtime_subnet_id: 01e6f4fc-d4b4-4d1d-8587-02e35bf1f932          # выход runtimeSubnetId
runtime_security_group_id: 1094a1f0-02b3-4469-a515-41c345c94670  # выход runtimeSecurityGroupId
# Образ runtime (scripts/build-runtime-image.sh): равен infra:runtimeImageId в Pulumi.prod.yaml (тест test_runtime_image)
runtime_image_id: 8f57fbe7-2b6e-4e0b-a8ac-edf936815411           # выход runtimeImageId
runtime_flavor_id: "1012"                                        # выход runtimeFlavorId (SL1.1-2048)
runtime_volume_type: fast.ru-9a                                  # выход runtimeVolumeType
runtime_ssh_key_name: runtime-provisioner                        # выход runtimeKeypairName
runtime_ssh_user: root
# Окружение в metadata VPS и логах backend (RUNTIME_ENV_NAME, обязателен для openstack)
runtime_env_name: production
# Публичные адреса gateway и auxiliary VPS через запятую: kernel до них не достучится
runtime_blocked_public_ips: 87.228.26.154,87.228.26.22           # выход runtimeBlockedPublicIps
# Прочие RUNTIME_* (RUNTIME_ROOT_DISK_GIB, RUNTIME_PYTHON_IMAGE, RUNTIME_KERNEL_DNS,
# таймауты, лимиты) имеют значения по умолчанию в backend; задавать здесь только при необходимости:
#   runtime_extra_env: { RUNTIME_PYTHON_IMAGE: "ghcr.io/...@sha256:...", RUNTIME_MAX_ACTIVE: "3" }
# Одновременно активных окружений (по умолчанию 3): при тестировании несколькими людьми слоты кончались (infra#136)
runtime_extra_env: { RUNTIME_MAX_ACTIVE: "10" }
# Секреты runtime — выходы Pulumi с --show-secrets, в vault.yml (сертификаты не секретны, но
# многострочные — лежат там же, рядом со своими ключами)
runtime_os_password: "{{ vault_runtime_os_password }}"           # runtimeOsPassword
runtime_secrets_key: "{{ vault_runtime_secrets_key }}"           # runtimeSecretsKey (base64 32 байт)
runtime_ssh_private_key: "{{ vault_runtime_ssh_private_key }}"   # runtimeSshPrivateKey
runtime_ca_cert: "{{ vault_runtime_ca_cert }}"                   # runtimeCaCert
runtime_ca_key: "{{ vault_runtime_ca_key }}"                     # runtimeCaKey
runtime_client_cert: "{{ vault_runtime_client_cert }}"           # runtimeClientCert
runtime_client_key: "{{ vault_runtime_client_key }}"             # runtimeClientKey
