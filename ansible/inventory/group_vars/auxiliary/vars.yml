# Вспомогательная VPS для сервиса вебхуков (auxiliary.yml). Снаружи порты закрывает security group
# Selectel (pulumi/index.ts, «auxiliary»): Docker публикует порты мимо ufw. ufw — второй слой.
firewall_rules:
  - { name: SSH, port: "22", proto: tcp }
  - { name: HTTP, port: "80", proto: tcp }
  - { name: HTTPS, port: "443", proto: tcp }

# Домен сервиса — выход Pulumi hooksDomain
hooks_domain: hooks.cellestial.ru
# Общий с ролью caddy параметр, поэтому он задан в inventory, а не defaults hooks.
caddy_image: caddy:2.11-alpine
hooks_githubbot_image: ghcr.io/cringe-driven-development-team/githubbot@sha256:0ea321460334578f6c997005034201851c11c84ccfff8f03bd55bbeb4b76bf92
hooks_githubbot_image_source_tag: ghcr.io/cringe-driven-development-team/githubbot:sha-2eb67135d898b2ed6e31df5007af30253386bd41
