---
ansible_host: "{{ monitoring_private_ip }}"
ansible_ssh_args: >-
  -C -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes
  -o StrictHostKeyChecking=yes -o ForwardAgent=no
ansible_ssh_common_args: "-o ProxyJump=cellestial-vps3"
firewall_rules:
  - { name: SSH с VPS3, port: "22", proto: tcp, src: "{{ auxiliary_private_ip }}/32" }
  - { name: HTTP, port: "80", proto: tcp }
  - { name: HTTPS, port: "443", proto: tcp }
monitoring_compose_dir: /opt/cellestial-monitoring
caddy_image: caddy:2.11-alpine
prometheus_image: prom/prometheus:v3.5.1
grafana_image: grafana/grafana:12.1.1
monitoring_data_dir: /var/lib/cellestial-monitoring
monitoring_tsdb_limit: 30GB
monitoring_bridge_subnet: 172.31.164.0/24
monitoring_bridge_gateway: 172.31.164.1
monitoring_environment: "{{ runtime_env_name }}"
monitoring_optional_targets: []
node_exporter_bind_ip: 127.0.0.1
