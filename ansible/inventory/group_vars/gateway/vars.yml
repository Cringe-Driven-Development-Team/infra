# Единственная VPS: публичный IP, открыты наружу 22/80/443 (DoD)
firewall_rules:
  - { name: SSH, port: "22", proto: tcp }
  - { name: HTTP, port: "80", proto: tcp }
  - { name: HTTPS, port: "443", proto: tcp }

# Gateway — jump-хост Ansible к приватной VPS2 (infra#59) и SSH-туннель локального BFF к mTLS-прокси её
# Go API (infra#155, infra#160), когда VPS2 есть в inventory. Других назначений пересылки нет
# Сертификат mTLS этого хоста (infra#160, roles/app/tasks/mtls-cert.yml): клиентский BFF
app_mtls_name: client

ssh_hardening_jump_targets: "{{ [app_backend_address ~ ':22', app_backend_address ~ ':8443'] if app_backend_address else [] }}"

node_exporter_bind_ip: "{{ app_gateway_address }}"
