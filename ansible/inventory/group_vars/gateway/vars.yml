# Единственная VPS: публичный IP, открыты наружу 22/80/443 (DoD)
firewall_rules:
  - { name: SSH, port: "22", proto: tcp }
  - { name: HTTP, port: "80", proto: tcp }
  - { name: HTTPS, port: "443", proto: tcp }

# Gateway — jump-хост Ansible к приватной VPS2 (infra#59) и SSH-туннель локального BFF к её Go API
# (infra#155), когда VPS2 есть в inventory. Других назначений пересылки нет
ssh_hardening_jump_targets: "{{ [app_backend_address ~ ':22', app_backend_address ~ ':8080'] if app_backend_address else [] }}"
