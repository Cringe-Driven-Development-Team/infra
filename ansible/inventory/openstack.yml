---
# Dynamic inventory: единственная VPS проекта, созданного Pulumi.
# Учётные данные — облако selectel: из OS_* (. ./env.sh) или из ansible/clouds.yaml
# (см. clouds.yaml.example, файл в .gitignore). Запускать из каталога ansible/: путь clouds.yaml относительный.
# ansible_host: floating IP сервера (публичный адрес).
plugin: openstack.cloud.openstack
clouds_yaml_path:
  - clouds.yaml
only_clouds:
  - selectel
fail_on_errors: true
expand_hostvars: false
legacy_groups: false
strict: true
groups:
  # metadata задаётся в pulumi/index.ts: { role: "gateway", env: "release" }
  gateway: (openstack.metadata | default({})).get('role') == 'gateway'
