---
# Раньше Caddy ставился на хост из apt и держал 80/443 — контейнер с ним не поднимется.
# Пакет удаляется (apt сам останавливает сервис), репозиторий и ключ — тоже.
- name: Удалить Caddy, установленный на хост через apt
  ansible.builtin.package:
    name: caddy
    state: absent

- name: Удалить apt-репозиторий Caddy и его ключ
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/caddy-stable.list
    - /etc/apt/keyrings/caddy-stable.asc

- name: Каталоги проекта Compose
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ app_compose_dir }}"
    - "{{ app_compose_dir }}/caddy"

# Каталог caddy/ монтируется в контейнер целиком, а не один файл: template заменяет файл
# атомарно (новый inode), и bind-mount отдельного файла продолжал бы видеть старую версию.
- name: Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ app_compose_dir }}/caddy/Caddyfile"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      docker run --rm -v %s:/tmp/Caddyfile:ro {{ caddy_image }}
      caddy validate --config /tmp/Caddyfile --adapter caddyfile
  notify: Reload caddy

- name: Файл compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ app_compose_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Поднять проект Compose
  community.docker.docker_compose_v2:
    project_src: "{{ app_compose_dir }}"
    state: present
    pull: missing
