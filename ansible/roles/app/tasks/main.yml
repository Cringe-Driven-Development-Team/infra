---
- name: Validate the deployment inputs
  ansible.builtin.import_tasks: validate.yml

- name: Choose the image tags
  ansible.builtin.import_tasks: tags.yml

# Новые .env и compose.yml пишутся до pull и запуска. Упала выкатка — возвращаются прежние: иначе
# тег неудачной выкатки остался бы в .env, site.yml счёл бы BFF выкаченным, а следующая выкатка
# унаследовала бы этот тег. Контейнеры при этом не откатываются — нужна выкатка с рабочим тегом.
# На свежей VPS2 compose.yml ещё нет: Caddy (роль caddy) её не готовит
- name: Find the deployed Compose project
  ansible.builtin.stat:
    path: "{{ app_compose_dir }}/compose.yml"
  register: app_deployed_compose

- name: Remember which project files exist
  ansible.builtin.set_fact:
    app_kept_files: >-
      {{ (['compose.yml'] if app_deployed_compose.stat.exists else [])
         + (['.env'] if app_deployed_env.content is defined else []) }}

- name: Project directory
  ansible.builtin.file:
    path: "{{ app_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep the deployed project files
  ansible.builtin.copy:
    src: "{{ app_compose_dir }}/{{ item }}"
    dest: "{{ app_compose_dir }}/{{ item }}.previous"
    remote_src: true
    mode: preserve
  loop: "{{ app_kept_files }}"
  no_log: true

- name: Deploy the application
  block:
    - name: Write the application environment from Vault
      ansible.builtin.template:
        src: env.j2
        dest: "{{ app_compose_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Redis configuration directory
      when: "'redis' in app_services"
      ansible.builtin.file:
        path: "{{ app_compose_dir }}/redis"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Пароль Redis внутри: файл читает только пользователь redis контейнера
    - name: Write the Redis configuration
      ansible.builtin.template:
        src: redis.conf.j2
        dest: "{{ app_compose_dir }}/redis/redis.conf"
        owner: "{{ app_redis_uid }}"
        group: "{{ app_redis_gid }}"
        mode: "0600"
      notify: Recreate Redis with the new configuration
      no_log: true
      when: "'redis' in app_services"

    # Runtime-VPS (infra#89): ключи и сертификаты — файлами 0400 пользователя контейнера Go API,
    # каталогом (замена файла шаблоном видна в контейнере); каталог заданий Ansible — writable
    - name: Runtime files on VPS2
      when: "'api' in app_services and runtime_enabled | bool"
      block:
        - name: Runtime secrets directory
          ansible.builtin.file:
            path: "{{ app_runtime_secrets_dir }}"
            state: directory
            owner: "{{ app_backend_uid }}"
            group: "{{ app_backend_uid }}"
            mode: "0500"

        - name: Write the runtime keys and certificates from Vault
          ansible.builtin.copy:
            content: "{{ item.content | trim }}\n"
            dest: "{{ app_runtime_secrets_dir }}/{{ item.name }}"
            owner: "{{ app_backend_uid }}"
            group: "{{ app_backend_uid }}"
            mode: "0400"
          loop:
            - { name: ssh_key, content: "{{ runtime_ssh_private_key }}" }
            - { name: ca.crt, content: "{{ runtime_ca_cert }}" }
            - { name: ca.key, content: "{{ runtime_ca_key }}" }
            - { name: client.crt, content: "{{ runtime_client_cert }}" }
            - { name: client.key, content: "{{ runtime_client_key }}" }
          loop_control:
            label: "{{ item.name }}"
          notify: Recreate the API with the new runtime files
          no_log: true

        - name: Runtime work directory of the Go API
          ansible.builtin.file:
            path: "{{ app_runtime_work_dir }}"
            state: directory
            owner: "{{ app_backend_uid }}"
            group: "{{ app_backend_uid }}"
            mode: "0700"

        - name: Runtime playbook directory
          ansible.builtin.file:
            path: "{{ app_runtime_playbook_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        # Плейбук runtime-VPS (ansible/runtime) запускает Go API: Compose монтирует каталог read-only
        - name: Copy the runtime VPS playbook
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/runtime/"
            dest: "{{ app_runtime_playbook_dir }}/"
            owner: root
            group: root
            mode: u=rwX,go=rX
            directory_mode: "0755"

    - name: Write the full application Compose project
      ansible.builtin.template:
        src: compose.yml.j2
        dest: "{{ app_compose_dir }}/compose.yml"
        owner: root
        group: root
        mode: "0644"

    # BFF уже скачан анонимно по digest и сверен (pull-bff.yml) до изменения файлов
    - name: Pull the deployed image with temporary registry authentication
      ansible.builtin.import_tasks: pull-image.yml
      when: app_deploy_service == 'api'

    - name: Pull missing public service images after GHCR logout
      community.docker.docker_compose_v2_pull:
        project_src: "{{ app_compose_dir }}"
        services: "{{ ['caddy', 'postgres', 'redis'] | intersect(app_services) }}"
        policy: missing

    - name: Start the application and wait for healthchecks
      community.docker.docker_compose_v2:
        project_src: "{{ app_compose_dir }}"
        state: present
        pull: never
        # переезд Go на VPS2: сервисы, которых больше нет в compose.yml, останавливаются; тома остаются
        remove_orphans: true
        wait: true
        wait_timeout: "{{ app_wait_timeout }}"

  rescue:
    - name: Restore the deployed project files
      ansible.builtin.copy:
        src: "{{ app_compose_dir }}/{{ item }}.previous"
        dest: "{{ app_compose_dir }}/{{ item }}"
        remote_src: true
        mode: preserve
      loop: "{{ app_kept_files }}"
      no_log: true

    - name: Remove the files of a failed first deployment
      ansible.builtin.file:
        path: "{{ app_compose_dir }}/compose.yml"
        state: absent
      when: not app_deployed_compose.stat.exists

    - name: Remove the environment of a failed first deployment
      ansible.builtin.file:
        path: "{{ app_compose_dir }}/.env"
        state: absent
      when: app_deployed_env.content is not defined

    - name: Stop after restoring the project files
      ansible.builtin.fail:
        msg: >-
          Deployment failed at "{{ ansible_failed_task.name }}". The previous .env and compose.yml
          are restored; containers are not rolled back — deploy a working tag.

  always:
    - name: Remove the copies of the project files
      ansible.builtin.file:
        path: "{{ app_compose_dir }}/{{ item }}.previous"
        state: absent
      loop:
        - compose.yml
        - .env

# Новый redis.conf — до маршрута BFF и итоговой проверки (handler пересоздаёт Redis и ждёт healthy)
- name: Apply the Redis configuration
  ansible.builtin.meta: flush_handlers

# Caddy ведёт на BFF, только когда тот выкачен; до первой выкатки BFF — заглушка 503
- name: Route Caddy to the BFF
  when: "'caddy' in app_services"
  ansible.builtin.template:
    src: "{{ role_path }}/../caddy/templates/Caddyfile.j2"
    dest: "{{ app_compose_dir }}/caddy/Caddyfile"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      docker run --rm -v %s:/tmp/Caddyfile:ro {{ caddy_image }}
      caddy validate --config /tmp/Caddyfile --adapter caddyfile
  vars:
    caddy_bff_enabled: "{{ app_bff_ref | length > 0 }}"
  notify: Reload caddy

- name: Apply the Caddy route before the public probe
  ansible.builtin.meta: flush_handlers

# Runtime выключен: ключей runtime и плейбука на VPS2 нет (каталог заданий остаётся — в нём только
# временные каталоги операций, Go API удаляет их сам)
- name: Remove the runtime files when runtime VPS are disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ app_runtime_secrets_dir }}"
    - "{{ app_runtime_playbook_dir }}"
  when: "'api' in app_services and not (runtime_enabled | bool)"
