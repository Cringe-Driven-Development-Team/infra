---
- name: Validate the deployment inputs
  ansible.builtin.import_tasks: validate.yml

- name: Choose the image tags
  ansible.builtin.import_tasks: tags.yml

# Новые .env и compose.yml пишутся до pull и запуска. Упала выкатка — возвращаются прежние: иначе
# тег неудачной выкатки остался бы в .env, site.yml счёл бы BFF выкаченным, а следующая выкатка
# унаследовала бы этот тег. Контейнеры при этом не откатываются — нужна выкатка с рабочим тегом.
- name: Keep the deployed project files
  ansible.builtin.copy:
    src: "{{ app_compose_dir }}/{{ item }}"
    dest: "{{ app_compose_dir }}/{{ item }}.previous"
    remote_src: true
    mode: preserve
  loop: "{{ ['compose.yml'] + (['.env'] if app_deployed_env.content is defined else []) }}"
  no_log: true

- name: Deploy the application
  block:
    - name: Write the application environment from Vault
      ansible.builtin.template:
        src: env.j2
        dest: "{{ app_compose_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Redis configuration directory
      ansible.builtin.file:
        path: "{{ app_compose_dir }}/redis"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Пароль Redis внутри: файл читает только пользователь redis контейнера
    - name: Write the Redis configuration
      ansible.builtin.template:
        src: redis.conf.j2
        dest: "{{ app_compose_dir }}/redis/redis.conf"
        owner: "{{ app_redis_uid }}"
        group: "{{ app_redis_gid }}"
        mode: "0600"
      notify: Recreate Redis with the new configuration
      no_log: true

    - name: Write the full application Compose project
      ansible.builtin.template:
        src: compose.yml.j2
        dest: "{{ app_compose_dir }}/compose.yml"
        owner: root
        group: root
        mode: "0644"

    # BFF уже скачан анонимно по digest и сверен (pull-bff.yml) до изменения файлов
    - name: Pull the deployed image with temporary registry authentication
      ansible.builtin.import_tasks: pull-image.yml
      when: app_deploy_service == 'api'

    - name: Pull missing public service images after GHCR logout
      community.docker.docker_compose_v2_pull:
        project_src: "{{ app_compose_dir }}"
        services:
          - caddy
          - postgres
          - redis
        policy: missing

    - name: Start the application and wait for healthchecks
      community.docker.docker_compose_v2:
        project_src: "{{ app_compose_dir }}"
        state: present
        pull: never
        wait: true
        wait_timeout: "{{ app_wait_timeout }}"

  rescue:
    - name: Restore the deployed project files
      ansible.builtin.copy:
        src: "{{ app_compose_dir }}/{{ item }}.previous"
        dest: "{{ app_compose_dir }}/{{ item }}"
        remote_src: true
        mode: preserve
      loop: "{{ ['compose.yml'] + (['.env'] if app_deployed_env.content is defined else []) }}"
      no_log: true

    - name: Remove the environment of a failed first deployment
      ansible.builtin.file:
        path: "{{ app_compose_dir }}/.env"
        state: absent
      when: app_deployed_env.content is not defined

    - name: Stop after restoring the project files
      ansible.builtin.fail:
        msg: >-
          Deployment failed at "{{ ansible_failed_task.name }}". The previous .env and compose.yml
          are restored; containers are not rolled back — deploy a working tag.

  always:
    - name: Remove the copies of the project files
      ansible.builtin.file:
        path: "{{ app_compose_dir }}/{{ item }}.previous"
        state: absent
      loop:
        - compose.yml
        - .env

# Новый redis.conf — до маршрута BFF и итоговой проверки (handler пересоздаёт Redis и ждёт healthy)
- name: Apply the Redis configuration
  ansible.builtin.meta: flush_handlers

# Caddy ведёт на BFF, только когда тот выкачен; до первой выкатки BFF — заглушка 503
- name: Route Caddy to the BFF
  ansible.builtin.template:
    src: "{{ role_path }}/../caddy/templates/Caddyfile.j2"
    dest: "{{ app_compose_dir }}/caddy/Caddyfile"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      docker run --rm -v %s:/tmp/Caddyfile:ro {{ caddy_image }}
      caddy validate --config /tmp/Caddyfile --adapter caddyfile
  vars:
    caddy_bff_enabled: "{{ app_bff_ref | length > 0 }}"
  notify: Reload caddy

- name: Apply the Caddy route before the public probe
  ansible.builtin.meta: flush_handlers
