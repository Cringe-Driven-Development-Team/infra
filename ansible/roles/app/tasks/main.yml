---
- name: Validate the deployment inputs
  ansible.builtin.import_tasks: validate.yml

- name: Choose the image tags
  ansible.builtin.import_tasks: tags.yml

- name: Write the application environment from Vault
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Redis configuration directory
  ansible.builtin.file:
    path: "{{ app_compose_dir }}/redis"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Пароль Redis внутри: файл читает только пользователь redis контейнера
- name: Write the Redis configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ app_compose_dir }}/redis/redis.conf"
    owner: "{{ app_redis_uid }}"
    group: "{{ app_redis_gid }}"
    mode: "0600"
  notify: Recreate Redis with the new configuration
  no_log: true

- name: Write the full application Compose project
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ app_compose_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Pull the deployed image with temporary registry authentication
  ansible.builtin.import_tasks: pull-image.yml

- name: Pull missing public service images after GHCR logout
  community.docker.docker_compose_v2_pull:
    project_src: "{{ app_compose_dir }}"
    services:
      - caddy
      - postgres
      - redis
    policy: missing

- name: Start the application and wait for healthchecks
  community.docker.docker_compose_v2:
    project_src: "{{ app_compose_dir }}"
    state: present
    pull: never
    wait: true
    wait_timeout: "{{ app_wait_timeout }}"

# Новый redis.conf — до маршрута BFF и итоговой проверки (handler пересоздаёт Redis и ждёт healthy)
- name: Apply the Redis configuration
  ansible.builtin.meta: flush_handlers

# Caddy ведёт на BFF, только когда тот выкачен; до первой выкатки BFF — заглушка 503
- name: Route Caddy to the BFF
  ansible.builtin.template:
    src: "{{ role_path }}/../caddy/templates/Caddyfile.j2"
    dest: "{{ app_compose_dir }}/caddy/Caddyfile"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      docker run --rm -v %s:/tmp/Caddyfile:ro {{ caddy_image }}
      caddy validate --config /tmp/Caddyfile --adapter caddyfile
  vars:
    caddy_bff_enabled: "{{ app_bff_tag | length > 0 }}"
  notify: Reload caddy

- name: Apply the Caddy route before the public probe
  ansible.builtin.meta: flush_handlers
