---
# Проверка BFF снаружи, без аккаунта пользователя: deploy-bff.yml после выкатки и verify.yml.
# Внутренний /health — healthcheck Compose; здесь — то, что видит браузер. bff_probe_release — полный
# SHA релиза: он же в <meta name="release"> HTML. Гостю HTML отдаёт /login (защищённые страницы — 302).
- name: Choose a fresh nonexistent login for the external probe
  ansible.builtin.set_fact:
    app_probe_login: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['0123456789abcdef']) }}"

- name: Backend external BFF check
  ansible.builtin.uri:
    url: "https://{{ app_domain }}/api/auth/login"
    method: POST
    headers:
      Origin: "https://{{ app_domain }}"
      X-CSRF: "1"
      Content-Type: application/json
    body_format: json
    body:
      login: "{{ app_probe_login }}"
      password: deploy-probe-invalid-password
    status_code: 400
    return_content: true
    validate_certs: true
    follow_redirects: none
    use_proxy: false
    timeout: 5
  register: app_probe_login_result
  delegate_to: localhost
  become: false
  failed_when: >-
    app_probe_login_result.status | default(0) != 400
    or (app_probe_login_result.json.error.code | default('')) != 'BAD_REQUEST'
    or (app_probe_login_result.json.error.appCode | default('')) != 'invalid_credentials'
  until: app_probe_login_result is succeeded
  retries: 5
  delay: 5

- name: Guest HTML comes from the BFF
  ansible.builtin.uri:
    url: "https://{{ app_domain }}/login"
    headers:
      Accept: text/html
    return_content: true
    follow_redirects: none
    use_proxy: false
    timeout: 5
  register: app_probe_html
  delegate_to: localhost
  become: false
  until: app_probe_html is succeeded
  retries: 5
  delay: 5

- name: The HTML has one guest bootstrap, its release and no caching
  ansible.builtin.assert:
    that:
      - app_probe_html.content | regex_findall('<script id="bootstrap"') | length == 1
      - app_probe_html.content is search('<script id="bootstrap" type="application/json">\{"user":null\}</script>')
      - app_probe_html.content is search('<meta name="release" content="' ~ bff_probe_release ~ '"')
      - app_probe_html.cache_control | default('') == 'private, no-store'
      - app_probe_html.x_content_type_options | default('') == 'nosniff'
      # несколько одинаковых заголовков uri склеивает через запятую — точное значение означает один
      - app_probe_html.strict_transport_security | default('') == 'max-age=31536000'
      - >-
        (app_probe_html.content_security_policy_report_only
        if caddy_csp_report_only | default(true) | bool
        else app_probe_html.content_security_policy) | default('') is search("default-src 'none'")
      - caddy_csp_report_only | default(true) | bool or app_probe_html.content_security_policy_report_only is not defined
    fail_msg: >-
      {{ app_domain }} does not serve the guest HTML of the BFF
      release {{ bff_probe_release }} with nosniff, HSTS, CSP and Cache-Control: private, no-store.

# Админская SPA OnlineConf (infra#204): отдельный HTML того же релиза по вложенной ссылке, JS и CSS — с CDN
- name: The OnlineConf admin HTML comes from the BFF by a nested link
  ansible.builtin.uri:
    url: "https://{{ app_domain }}/onlineconf/keys"
    headers:
      Accept: text/html
    return_content: true
    follow_redirects: none
    use_proxy: false
    timeout: 5
  register: app_probe_admin_html
  delegate_to: localhost
  become: false

- name: Collect the admin JS and CSS
  ansible.builtin.set_fact:
    app_probe_admin_assets: "{{ app_probe_admin_html.content | regex_findall('(?:src|href)=\"([^\"]+\\.(?:js|css))\"') }}"

- name: The admin HTML is the admin SPA of this release, not the product HTML
  ansible.builtin.assert:
    that:
      - app_probe_admin_html.content is search('<title>OnlineConf')
      - app_probe_admin_html.content is not search('<script id="bootstrap"')
      - app_probe_admin_html.content is search('<meta name="release" content="' ~ bff_probe_release ~ '"')
      - app_probe_admin_html.cache_control | default('') == 'private, no-store'
      - app_probe_admin_assets | select('search', '\\.js$') | list | length > 0
      - app_probe_admin_assets | reject('match', ('https://' ~ frontend_cdn_domain ~ '/releases/' ~ bff_probe_release ~ '/') | regex_escape) | list | length == 0
    fail_msg: >-
      {{ app_domain }}/onlineconf/keys does not serve the admin HTML of release {{ bff_probe_release }}
      with JS and CSS from https://{{ frontend_cdn_domain }}/releases/{{ bff_probe_release }}/.

# JS подключён как <script type="module" crossorigin>: без CORS браузер его не выполнит
- name: The admin JS and CSS load from the CDN with their content types and JS with CORS
  ansible.builtin.uri:
    url: "{{ item }}"
    headers:
      Origin: "https://{{ app_domain }}"
    follow_redirects: none
    use_proxy: false
    timeout: 5
  register: app_probe_admin_asset
  delegate_to: localhost
  become: false
  failed_when: >-
    app_probe_admin_asset.status != 200
    or (app_probe_admin_asset.content_type | default('')).split(';')[0] | trim | lower
    not in (['text/javascript', 'application/javascript'] if item is search('\\.js$') else ['text/css'])
    or (item is search('\\.js$')
        and app_probe_admin_asset.access_control_allow_origin | default('') not in ['*', 'https://' ~ app_domain])
  loop: "{{ app_probe_admin_assets }}"

- name: Protected API routes without a session are UNAUTHORIZED
  ansible.builtin.uri:
    url: "https://{{ app_domain }}{{ item }}"
    headers:
      X-CSRF: "1"
    status_code: 401
    return_content: true
    follow_redirects: none
    use_proxy: false
    timeout: 5
  register: app_probe_rpc
  delegate_to: localhost
  become: false
  failed_when: >-
    app_probe_rpc.status != 401
    or (app_probe_rpc.json.error.code | default('')) != 'UNAUTHORIZED'
  # админский API OnlineConf: без сессии BFF отвечает JSON и в OnlineConf не ходит
  loop:
    - /api/users/me
    - /api/onlineconf/access

- name: Go API, unknown API paths and the internal health are not public
  ansible.builtin.uri:
    url: "https://{{ app_domain }}{{ item }}"
    status_code: 404
    return_content: true
    follow_redirects: none
    use_proxy: false
    timeout: 5
  register: app_probe_hidden
  delegate_to: localhost
  become: false
  failed_when: app_probe_hidden.status != 404 or app_probe_hidden.content is search('<html', ignorecase=true)
  loop:
    - /api/v1/users/me
    - /api/unknown
    - /health
