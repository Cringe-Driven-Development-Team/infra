---
# Проверка BFF снаружи, без аккаунта пользователя: deploy-bff.yml после выкатки и verify.yml.
# Внутренний /health — healthcheck Compose; здесь — то, что видит браузер. bff_probe_release — полный
# SHA релиза: он же в <meta name="release"> HTML. Гостю HTML отдаёт /login (защищённые страницы — 302).
- name: Choose a fresh nonexistent login for the external probe
  ansible.builtin.set_fact:
    app_probe_login: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['0123456789abcdef']) }}"

- name: Backend external BFF check
  ansible.builtin.uri:
    url: "https://{{ app_domain }}/api/trpc/auth.login"
    method: POST
    headers:
      Origin: "https://{{ app_domain }}"
      X-CSRF: "1"
      Content-Type: application/json
    body_format: json
    body:
      login: "{{ app_probe_login }}"
      password: deploy-probe-invalid-password
    status_code: 400
    return_content: true
    validate_certs: true
    follow_redirects: none
    use_proxy: false
    timeout: 5
  register: app_probe_login_result
  delegate_to: localhost
  become: false
  failed_when: >-
    app_probe_login_result.status | default(0) != 400
    or (app_probe_login_result.json.error.data.code | default('')) != 'BAD_REQUEST'
    or (app_probe_login_result.json.error.data.appCode | default('')) != 'invalid_credentials'
  until: app_probe_login_result is succeeded
  retries: 5
  delay: 5

- name: Guest HTML comes from the BFF
  ansible.builtin.uri:
    url: "https://{{ app_domain }}/login"
    headers:
      Accept: text/html
    return_content: true
    follow_redirects: none
    use_proxy: false
    timeout: 5
  register: app_probe_html
  delegate_to: localhost
  become: false
  until: app_probe_html is succeeded
  retries: 5
  delay: 5

- name: The HTML has one guest bootstrap, its release and no caching
  ansible.builtin.assert:
    that:
      - app_probe_html.content | regex_findall('<script id="bootstrap"') | length == 1
      - app_probe_html.content is search('<script id="bootstrap" type="application/json">\{"user":null\}</script>')
      - app_probe_html.content is search('<meta name="release" content="' ~ bff_probe_release ~ '"')
      - app_probe_html.cache_control | default('') == 'private, no-store'
      - app_probe_html.x_content_type_options | default('') == 'nosniff'
      - >-
        (app_probe_html.content_security_policy_report_only
        if caddy_csp_report_only | default(true) | bool
        else app_probe_html.content_security_policy) | default('') is search("default-src 'none'")
      - caddy_csp_report_only | default(true) | bool or app_probe_html.content_security_policy_report_only is not defined
    fail_msg: >-
      {{ app_domain }} does not serve the guest HTML of the BFF
      release {{ bff_probe_release }} with nosniff, CSP and Cache-Control: private, no-store.

- name: A protected RPC without a session is a tRPC UNAUTHORIZED
  ansible.builtin.uri:
    url: "https://{{ app_domain }}/api/trpc/users.me"
    headers:
      X-CSRF: "1"
    status_code: 401
    return_content: true
    follow_redirects: none
    use_proxy: false
    timeout: 5
  register: app_probe_rpc
  delegate_to: localhost
  become: false
  failed_when: >-
    app_probe_rpc.status != 401
    or (app_probe_rpc.json.error.data.code | default('')) != 'UNAUTHORIZED'

- name: Go API, unknown API paths and the internal health are not public
  ansible.builtin.uri:
    url: "https://{{ app_domain }}{{ item }}"
    status_code: 404
    return_content: true
    follow_redirects: none
    use_proxy: false
    timeout: 5
  register: app_probe_hidden
  delegate_to: localhost
  become: false
  failed_when: app_probe_hidden.status != 404 or app_probe_hidden.content is search('<html', ignorecase=true)
  loop:
    - /api/v1/users/me
    - /api/unknown
    - /health
