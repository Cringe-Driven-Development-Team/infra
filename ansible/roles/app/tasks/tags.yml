---
# Выкатка меняет один образ, второй остаётся тем, что уже выкачен: образ Go, образ и релиз BFF — из .env
# на VPS.
- name: Read the deployed environment
  ansible.builtin.slurp:
    src: "{{ app_compose_dir }}/.env"
  register: app_deployed_env
  failed_when: false
  no_log: true

- name: Choose the images of this deployment
  ansible.builtin.set_fact:
    app_backend_ref: >-
      {{ backend_image_ref | default(app_deployed.BACKEND_IMAGE_REF) }}
    app_bff_ref: >-
      {{ bff_image_ref | default(app_deployed.BFF_IMAGE_REF) }}
    app_bff_release: >-
      {{ bff_release_sha | default(app_deployed.BFF_RELEASE_SHA) }}
  vars:
    app_deployed_text: "{{ app_deployed_env.content | default('') | b64decode }}"
    app_deployed:
      BACKEND_IMAGE_REF: >-
        {{ app_deployed_text | regex_findall('(?m)^BACKEND_IMAGE_REF=(ghcr[.]io/cringe-driven-development-team/backend@sha256:[0-9a-f]{64})$')
        | first | default('') }}
      BFF_IMAGE_REF: >-
        {{ app_deployed_text
        | regex_findall('(?m)^BFF_IMAGE_REF=(' ~ (app_bff_image | regex_escape) ~ '@sha256:[0-9a-f]{64})$')
        | first | default('') }}
      BFF_RELEASE_SHA: >-
        {{ app_deployed_text | regex_findall('(?m)^BFF_RELEASE_SHA=([0-9a-f]{40})$')
        | first | default('') }}

# Сервисы закреплены: gateway — Caddy и BFF, VPS2 — Go, его mTLS-прокси, Postgres, Redis.
# BFF — только после первой выкатки (есть образ).
- name: Choose the services of this host
  ansible.builtin.set_fact:
    app_services: >-
      {{ (['caddy'] + (['bff'] if app_bff_ref else []))
         if inventory_hostname in groups['gateway'] else ['api', 'api-proxy', 'postgres', 'redis'] }}

# BFF ждёт healthy Go: без выкаченного бэка Compose его не поднимет
- name: Require a deployed backend
  ansible.builtin.assert:
    that:
      - app_backend_ref | length > 0
    fail_msg: No backend is deployed on the VPS. Run deploy-backend.yml with backend_image_ref first.
  when: "'api' in app_services"

- name: Read the VPS2 cutover marker before deploying BFF
  ansible.builtin.stat:
    path: "{{ app_compose_dir }}/microservices/v2-active"
  delegate_to: "{{ groups['backend'][0] }}"
  register: app_bff_cutover
  when: app_deploy_service == 'bff'

- name: Require the Go API on VPS2
  ansible.builtin.include_tasks: probe-backend.yml
  vars:
    backend_probe_address: "{{ app_backend_address }}"
  when: app_deploy_service == 'bff' and not app_bff_cutover.stat.exists

- name: Require the Identity and Workspace HTTPS APIs from gateway
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --show-error
      - --noproxy
      - "*"
      - --max-time
      - "5"
      - --cacert
      - "{{ app_mtls_dir }}/ca.crt"
      - --cert
      - "{{ app_mtls_dir }}/client.crt"
      - --key
      - "{{ app_mtls_dir }}/client.key"
      - --resolve
      - "{{ item.url | urlsplit('hostname') }}:{{ item.url | urlsplit('port') }}:{{ app_backend_address }}"
      - --header
      - "@-"
      - --output
      - /dev/null
      - --write-out
      - "%{http_code}"
      - "{{ item.url }}{{ item.path }}"
    stdin: "X-BFF-Key: {{ bff_api_key }}"
  loop:
    - { url: "{{ app_bff_identity_api_url }}", path: /users/me }
    - { url: "{{ app_bff_workspace_api_url }}", path: /notebooks }
  register: app_bff_api_probe
  changed_when: false
  failed_when: app_bff_api_probe.rc != 0 or app_bff_api_probe.stdout != '401'
  no_log: true
  when: app_deploy_service == 'bff' and app_bff_cutover.stat.exists
