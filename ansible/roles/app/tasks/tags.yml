---
# Выкатка меняет один образ, второй остаётся тем, что уже выкачен: тег Go, образ и релиз BFF — из .env
# на VPS.
- name: Read the deployed environment
  ansible.builtin.slurp:
    src: "{{ app_compose_dir }}/.env"
  register: app_deployed_env
  failed_when: false
  no_log: true

- name: Choose the images of this deployment
  ansible.builtin.set_fact:
    app_backend_tag: >-
      {{ backend_image_tag | default(app_deployed.BACKEND_IMAGE_TAG) }}
    app_bff_ref: >-
      {{ bff_image_ref | default(app_deployed.BFF_IMAGE_REF) }}
    app_bff_release: >-
      {{ bff_release_sha | default(app_deployed.BFF_RELEASE_SHA) }}
  vars:
    app_deployed_text: "{{ app_deployed_env.content | default('') | b64decode }}"
    app_deployed:
      BACKEND_IMAGE_TAG: >-
        {{ app_deployed_text | regex_findall('(?m)^BACKEND_IMAGE_TAG=(sha-[0-9a-f]{7,40})$')
        | first | default('') }}
      BFF_IMAGE_REF: >-
        {{ app_deployed_text
        | regex_findall('(?m)^BFF_IMAGE_REF=(' ~ (app_bff_image | regex_escape) ~ '@sha256:[0-9a-f]{64})$')
        | first | default('') }}
      BFF_RELEASE_SHA: >-
        {{ app_deployed_text | regex_findall('(?m)^BFF_RELEASE_SHA=([0-9a-f]{40})$')
        | first | default('') }}

# BFF ждёт healthy Go: без выкаченного бэка Compose его не поднимет
- name: Require a deployed backend
  ansible.builtin.assert:
    that:
      - app_backend_tag | length > 0
    fail_msg: No backend is deployed on the VPS. Run deploy-backend.yml with backend_image_tag first.
