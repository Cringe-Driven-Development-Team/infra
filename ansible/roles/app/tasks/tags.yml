---
# Выкатка меняет один образ, второй остаётся тем, что уже выкачен: образ Go, образ и релиз BFF — из .env
# на VPS.
- name: Read the deployed environment
  ansible.builtin.slurp:
    src: "{{ app_compose_dir }}/.env"
  register: app_deployed_env
  failed_when: false
  no_log: true

- name: Choose the images of this deployment
  ansible.builtin.set_fact:
    app_backend_ref: >-
      {{ backend_image_ref | default(app_deployed.BACKEND_IMAGE_REF) }}
    app_bff_ref: >-
      {{ bff_image_ref | default(app_deployed.BFF_IMAGE_REF) }}
    app_bff_release: >-
      {{ bff_release_sha | default(app_deployed.BFF_RELEASE_SHA) }}
  vars:
    app_deployed_text: "{{ app_deployed_env.content | default('') | b64decode }}"
    app_deployed:
      BACKEND_IMAGE_REF: >-
        {{ app_deployed_text | regex_findall('(?m)^BACKEND_IMAGE_REF=(ghcr[.]io/cringe-driven-development-team/backend@sha256:[0-9a-f]{64})$')
        | first | default('') }}
      BFF_IMAGE_REF: >-
        {{ app_deployed_text
        | regex_findall('(?m)^BFF_IMAGE_REF=(' ~ (app_bff_image | regex_escape) ~ '@sha256:[0-9a-f]{64})$')
        | first | default('') }}
      BFF_RELEASE_SHA: >-
        {{ app_deployed_text | regex_findall('(?m)^BFF_RELEASE_SHA=([0-9a-f]{40})$')
        | first | default('') }}

# Сервисы закреплены: gateway — Caddy и BFF, VPS2 — Go, Postgres, Redis.
# BFF — только после первой выкатки (есть образ).
- name: Choose the services of this host
  ansible.builtin.set_fact:
    app_services: >-
      {{ (['caddy'] + (['bff'] if app_bff_ref else []))
         if inventory_hostname in groups['gateway'] else ['api', 'postgres', 'redis'] }}

# BFF ждёт healthy Go: без выкаченного бэка Compose его не поднимет
- name: Require a deployed backend
  ansible.builtin.assert:
    that:
      - app_backend_ref | length > 0
    fail_msg: No backend is deployed on the VPS. Run deploy-backend.yml with backend_image_ref first.
  when: "'api' in app_services"

# BFF до переключения использует ту же проверку gateway → Go, что backend после переключения.
- name: Require the Go API on VPS2
  ansible.builtin.include_tasks: probe-backend.yml
  vars:
    backend_probe_address: "{{ app_backend_address }}"
  when: app_deploy_service == 'bff'
