---
# app_deploy_service — выкатываемый сервис (api или bff), задаёт playbook. Образ второго сервиса
# необязателен: без него остаётся выкаченный на VPS.
- name: Require one gateway and one backend VPS
  ansible.builtin.assert:
    that:
      - groups.get('gateway', []) | length == 1
      - groups.get('backend', []) | length == 1
    fail_msg: An inventory with one gateway and one backend VPS is required.

- name: Check the requested backend image digest
  ansible.builtin.assert:
    that:
      - app_backend_image == 'ghcr.io/cringe-driven-development-team/backend'
      - backend_image_ref is defined
      - backend_image_ref is string
      - backend_image_ref is match('^ghcr[.]io/cringe-driven-development-team/backend@sha256:[0-9a-f]{64}\Z')
      - backend_image_tag is not defined
    fail_msg: >-
      An explicit backend_image_ref=ghcr.io/cringe-driven-development-team/backend@sha256:<64 hex>
      is required, including for rollback; backend_image_tag is not supported.
  when: app_deploy_service == 'api'

- name: Change the backend only with deploy-backend.yml
  ansible.builtin.assert:
    that:
      - backend_image_ref is not defined
      - backend_image_tag is not defined
    fail_msg: backend_image_ref is accepted only by deploy-backend.yml; backend_image_tag is not supported.
  when: app_deploy_service != 'api'

# BFF (infra#74): только неизменяемый образ по digest из своего package и полный SHA релиза —
# по нему сверяются метка образа и <meta name="release"> в HTML. Тег не принимается. Package зашит
# здесь, а не берётся из app_bff_image: -e app_bff_image=… не должен разрешать чужой образ.
- name: Check the requested BFF image and release
  ansible.builtin.assert:
    that:
      - app_bff_image == 'ghcr.io/cringe-driven-development-team/bff'
      - bff_image_ref is defined
      - bff_image_ref is string
      - bff_image_ref is match('^ghcr[.]io/cringe-driven-development-team/bff@sha256:[0-9a-f]{64}$')
      - bff_release_sha is defined
      - bff_release_sha is string
      - bff_release_sha is match('^[0-9a-f]{40}$')
    fail_msg: >-
      Explicit bff_image_ref=ghcr.io/cringe-driven-development-team/bff@sha256:<64 hex> and
      bff_release_sha=<40 hex> are required, including for rollback; app_bff_image is not overridable.
  when: app_deploy_service == 'bff'

# Образ BFF меняет только deploy-bff.yml: там он скачивается и сверяется до записи в .env
- name: Change the BFF only with deploy-bff.yml
  ansible.builtin.assert:
    that:
      - bff_image_ref is not defined
      - bff_release_sha is not defined
    fail_msg: bff_image_ref and bff_release_sha are accepted only by deploy-bff.yml.
  when: app_deploy_service != 'bff'

- name: Check application secrets
  ansible.builtin.assert:
    that:
      - postgres_password | length > 0
      - jwt_secret | length > 0
      - csrf_secret | length > 0
      - postgres_password.splitlines() | length == 1
      - jwt_secret.splitlines() | length == 1
      - csrf_secret.splitlines() | length == 1
    fail_msg: Application secrets must be nonempty single-line values.
  no_log: true

# 43 символа base64 и один padding = декодируются ровно в 32 байта.
# Undefined и нестроковые значения отклоняются до проверки regex.
- name: Check the TOTP encryption key
  ansible.builtin.assert:
    that:
      - totp_encryption_key is defined
      - totp_encryption_key is string
      - totp_encryption_key | length == 44
      - totp_encryption_key is match('^[A-Za-z0-9+/]{43}=$')
    fail_msg: vault_totp_encryption_key must be base64 of exactly 32 bytes; preserve the existing key.
  no_log: true

- name: Check the BFF secrets
  ansible.builtin.assert:
    that:
      - session_key is match('^[A-Za-z0-9+/]{43}=$')
      - bff_api_key is match('^[A-Za-z0-9_-]{32,}$')
    fail_msg: >-
      vault_session_key must be base64 of exactly 32 bytes (openssl rand -base64 32);
      vault_bff_api_key must be 32+ characters of [A-Za-z0-9_-] (openssl rand -hex 32).
  no_log: true

# Пароль попадает в redis.conf как есть (requirepass) — только безопасные символы
- name: Check the Redis password
  ansible.builtin.assert:
    that:
      - redis_password is match('^[A-Za-z0-9_-]{16,}$')
    fail_msg: vault_redis_password must be 16+ characters of [A-Za-z0-9_-] (openssl rand -hex 32).
  no_log: true

- name: Check S3 credentials
  ansible.builtin.assert:
    that:
      - notebooks_s3_access_key | length > 0
      - notebooks_s3_secret_key | length > 0
      - notebooks_s3_access_key.splitlines() | length == 1
      - notebooks_s3_secret_key.splitlines() | length == 1
    fail_msg: S3 credentials must be nonempty single-line values.
  no_log: true

- name: Check S3 configuration
  ansible.builtin.assert:
    that:
      - s3_region | length > 0
      - s3_endpoint is match('^https://[^ /]+$')
      - avatars_bucket | length > 0
      - avatars_public_domain is match('^[a-zA-Z0-9.-]+$')
    fail_msg: Set S3 configuration in inventory/group_vars/all/vars.yml.

- name: Check CORS origins
  ansible.builtin.assert:
    that:
      - app_cors_allowed_origins is string
      - app_cors_allowed_origins is match('^https://[^ ]+$')
      - "'http://' not in app_cors_allowed_origins"
    fail_msg: Set app_cors_allowed_origins in inventory/group_vars/all/vars.yml to HTTPS origins only.

- name: Check the runtime VPS configuration
  ansible.builtin.assert:
    that:
      - runtime_provider == 'openstack'
      - runtime_os_auth_url is match('^https://[^ ]+$')
      - runtime_os_username is match('^[A-Za-z0-9._-]+$')
      - runtime_os_user_domain_name is match('^[0-9]+$')
      - runtime_os_project_id is match('^[0-9a-f]{32}$')
      - runtime_os_region is match('^[a-z0-9-]+$')
      - runtime_availability_zone is match('^[a-z0-9-]+$')
      - runtime_network_id is match('^[0-9a-f-]{36}$')
      - runtime_subnet_id is match('^[0-9a-f-]{36}$')
      - runtime_security_group_id is match('^[0-9a-f-]{36}$')
      - runtime_image_id is match('^[0-9a-f-]{36}$')
      - runtime_flavor_id | string is match('^[A-Za-z0-9._-]+$')
      - runtime_volume_type is match('^[A-Za-z0-9._-]+$')
      - runtime_ssh_key_name is match('^[A-Za-z0-9._-]+$')
      - runtime_ssh_user is match('^[a-z_][a-z0-9_-]*$')
      - runtime_env_name is match('^[A-Za-z0-9._-]+$')
      - runtime_blocked_public_ips is match('^[0-9]{1,3}([.][0-9]{1,3}){3}(,[0-9]{1,3}([.][0-9]{1,3}){3})*$')
      - runtime_extra_env is mapping
      - runtime_extra_env.keys() | select('match', '^RUNTIME_[A-Z0-9_]+$') | list | length == runtime_extra_env | length
    fail_msg: >-
      Set the runtime_* values in inventory/group_vars/all/vars.yml from the Pulumi runtime* outputs
      (RUNBOOK.md, "Runtime-VPS"); runtime_extra_env keys must be RUNTIME_*.
  when: runtime_enabled | bool

- name: Check the runtime VPS secrets
  ansible.builtin.assert:
    that:
      - runtime_os_password | length > 0
      - runtime_os_password.splitlines() | length == 1
      - runtime_secrets_key is match('^[A-Za-z0-9+/]{43}=$')
      - "'-----BEGIN OPENSSH PRIVATE KEY-----' in runtime_ssh_private_key"
      - "'-----BEGIN CERTIFICATE-----' in runtime_ca_cert"
      - "'-----BEGIN PRIVATE KEY-----' in runtime_ca_key"
      - "'-----BEGIN CERTIFICATE-----' in runtime_client_cert"
      - "'-----BEGIN PRIVATE KEY-----' in runtime_client_key"
    fail_msg: >-
      vault_runtime_* must hold the Pulumi runtime* outputs (pulumi stack output <name> --show-secrets):
      a single-line password, base64 of 32 bytes for the secrets key, OpenSSH and PKCS#8 PEM keys.
  when: runtime_enabled | bool
  no_log: true
