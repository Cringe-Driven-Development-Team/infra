---
# app_deploy_service — выкатываемый сервис (api или bff), задаёт playbook. Образ второго сервиса
# необязателен: без него остаётся выкаченный на VPS.
- name: Check the requested backend image tag
  ansible.builtin.assert:
    that:
      - backend_image_tag is defined
      - backend_image_tag is string
      - backend_image_tag is match('^sha-[0-9a-f]{7,40}$')
    fail_msg: "An explicit backend_image_tag=sha-<commit> is required, including for rollback."
  when: app_deploy_service == 'api' or backend_image_tag is defined

# BFF (infra#74): только неизменяемый образ по digest из своего package и полный SHA релиза —
# по нему сверяются метка образа и <meta name="release"> в HTML. Тег не принимается.
- name: Check the requested BFF image and release
  ansible.builtin.assert:
    that:
      - bff_image_ref is defined
      - bff_image_ref is string
      - bff_image_ref is match('^' ~ (app_bff_image | regex_escape) ~ '@sha256:[0-9a-f]{64}$')
      - bff_release_sha is defined
      - bff_release_sha is string
      - bff_release_sha is match('^[0-9a-f]{40}$')
    fail_msg: >-
      Explicit bff_image_ref={{ app_bff_image }}@sha256:<64 hex> and bff_release_sha=<40 hex> are
      required, including for rollback.
  when: app_deploy_service == 'bff'

# Образ BFF меняет только deploy-bff.yml: там он скачивается и сверяется до записи в .env
- name: Change the BFF only with deploy-bff.yml
  ansible.builtin.assert:
    that:
      - bff_image_ref is not defined
      - bff_release_sha is not defined
    fail_msg: bff_image_ref and bff_release_sha are accepted only by deploy-bff.yml.
  when: app_deploy_service != 'bff'

# GHCR credentials нужны только частному образу Go; публичный BFF скачивается анонимно
- name: Check whether controller GHCR credentials are present
  ansible.builtin.set_fact:
    app_ghcr_credentials_present:
      GHCR_USERNAME: "{{ lookup('ansible.builtin.env', 'GHCR_USERNAME') | trim | length > 0 }}"
      GHCR_TOKEN: "{{ lookup('ansible.builtin.env', 'GHCR_TOKEN') | trim | length > 0 }}"
  no_log: true

- name: Require controller GHCR credentials
  ansible.builtin.assert:
    that:
      - app_ghcr_credentials_present[item]
    fail_msg: "Set {{ item }} in the environment of the machine running Ansible."
    quiet: true
  loop:
    - GHCR_USERNAME
    - GHCR_TOKEN
  when: app_deploy_service == 'api'

- name: Check application secrets
  ansible.builtin.assert:
    that:
      - postgres_password | length > 0
      - jwt_secret | length > 0
      - csrf_secret | length > 0
      - postgres_password.splitlines() | length == 1
      - jwt_secret.splitlines() | length == 1
      - csrf_secret.splitlines() | length == 1
    fail_msg: Application secrets must be nonempty single-line values.
  no_log: true

- name: Check the BFF secrets
  ansible.builtin.assert:
    that:
      - session_key is match('^[A-Za-z0-9+/]{43}=$')
      - bff_api_key is match('^[A-Za-z0-9_-]{32,}$')
    fail_msg: >-
      vault_session_key must be base64 of exactly 32 bytes (openssl rand -base64 32);
      vault_bff_api_key must be 32+ characters of [A-Za-z0-9_-] (openssl rand -hex 32).
  no_log: true

# Пароль попадает в redis.conf как есть (requirepass) — только безопасные символы
- name: Check the Redis password
  ansible.builtin.assert:
    that:
      - redis_password is match('^[A-Za-z0-9_-]{16,}$')
    fail_msg: vault_redis_password must be 16+ characters of [A-Za-z0-9_-] (openssl rand -hex 32).
  no_log: true

- name: Check S3 credentials
  ansible.builtin.assert:
    that:
      - notebooks_s3_access_key | length > 0
      - notebooks_s3_secret_key | length > 0
      - notebooks_s3_access_key.splitlines() | length == 1
      - notebooks_s3_secret_key.splitlines() | length == 1
    fail_msg: S3 credentials must be nonempty single-line values.
  no_log: true

- name: Check S3 configuration
  ansible.builtin.assert:
    that:
      - s3_region | length > 0
      - s3_endpoint is match('^https://[^ /]+$')
      - notebooks_bucket | length > 0
      - avatars_bucket | length > 0
      - avatars_public_domain is match('^[a-zA-Z0-9.-]+$')
    fail_msg: Set S3 configuration in inventory/group_vars/all/vars.yml.

- name: Check CORS origins
  ansible.builtin.assert:
    that:
      - app_cors_allowed_origins is string
      - app_cors_allowed_origins is match('^https://[^ ]+$')
      - "'http://' not in app_cors_allowed_origins"
    fail_msg: Set app_cors_allowed_origins in inventory/group_vars/all/vars.yml to HTTPS origins only.
