---
# До записи .env/Compose: публичный backend скачивается без сохранённой авторизации VPS.
- name: Empty Docker config for an anonymous backend pull
  ansible.builtin.tempfile:
    state: directory
    suffix: .docker-anonymous
  register: app_backend_docker_config

- name: Pull the backend anonymously
  block:
    - name: Pull the backend image by digest without registry credentials
      ansible.builtin.command:
        argv:
          - docker
          - --config
          - "{{ app_backend_docker_config.path }}"
          - pull
          - "{{ backend_image_ref }}"
      register: app_backend_pull
      changed_when: "'Downloaded newer image' in app_backend_pull.stdout"

  rescue:
    - name: Stop before changing backend configuration
      ansible.builtin.fail:
        msg: >-
          {{ backend_image_ref }} cannot be pulled anonymously:
          {{ app_backend_pull.stderr | default('') | trim }}.
          The backend package must be public and the digest published.
          The application configuration and containers have not been changed.

  always:
    - name: Remove the empty backend Docker config
      ansible.builtin.file:
        path: "{{ app_backend_docker_config.path }}"
        state: absent
