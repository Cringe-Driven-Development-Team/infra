---
# Частный образ Go (deploy-backend.yml) с временными GHCR credentials; публичный BFF скачивает
# pull-bff.yml анонимно.
- name: Pull the private image with temporary GHCR credentials
  block:
    - name: Log in to GHCR using the controller environment
      ansible.builtin.command:
        argv:
          - docker
          - login
          - ghcr.io
          - --username
          - "{{ lookup('ansible.builtin.env', 'GHCR_USERNAME') }}"
          - --password-stdin
        stdin: "{{ lookup('ansible.builtin.env', 'GHCR_TOKEN') }}"
      no_log: true
      changed_when: true

    - name: Pull the requested private image
      community.docker.docker_compose_v2_pull:
        project_src: "{{ app_compose_dir }}"
        services:
          - "{{ app_deploy_service }}"
        policy: always

  always:
    - name: Remove GHCR credentials even when login or pull fails
      ansible.builtin.command:
        argv:
          - docker
          - logout
          - ghcr.io
      changed_when: true
