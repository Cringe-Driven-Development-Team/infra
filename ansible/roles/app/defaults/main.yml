---
app_backend_image: ghcr.io/cringe-driven-development-team/backend
# BFF (infra#58): публичный образ публикует CI фронта (frontend#4), выкатывается по digest —
# bff_image_ref (infra#74)
app_bff_image: ghcr.io/cringe-driven-development-team/bff
# Адрес Go для BFF: в одном проекте — сервис api, после переноса Go на VPS2 (infra#59) — её приватный
# адрес
app_bff_go_api_url: >-
  {{ 'http://' ~ app_backend_address ~ ':8080/api/v1' if app_backend_split | bool else 'http://api:8080/api/v1' }}
app_postgres_image: postgres:18-alpine
# Redis — refresh-сессии бэка (infra#46): только сеть app, данные в volume redis_data (AOF)
app_redis_image: redis:8-alpine
app_redis_maxmemory: 128mb
# uid/gid пользователя redis в образе: конфиг с паролем читает только он
app_redis_uid: 999
app_redis_gid: 1000
app_postgres_user: postgres
app_postgres_database: app_db
app_access_token_ttl: 15m
app_refresh_token_ttl: 720h
app_wait_timeout: 180
# Runtime-VPS (infra#89): uid пользователя app в образе Go API (build/main.Dockerfile backend) — он
# читает ключи (0400) и пишет каталог заданий Ansible
app_backend_uid: 10001
# Ключи и сертификаты runtime на VPS2 → /run/secrets/runtime в контейнере Go API (каталогом, read-only)
app_runtime_secrets_dir: "{{ app_compose_dir }}/runtime-secrets"
# Плейбук настройки runtime-VPS (ansible/runtime) на VPS2 → /app/deploy/runtime (read-only)
app_runtime_playbook_dir: "{{ app_compose_dir }}/runtime-playbook"
# Каталог заданий Ansible Go API (RUNTIME_WORK_DIR): тот же путь на VPS2 и в контейнере
app_runtime_work_dir: /var/lib/cellestial/runtime
# RUNTIME_* из .env, которые Compose передаёт Go API при runtime_enabled (имена — internal/config/runtime.go
# backend); RUNTIME_ENABLED передаётся всегда, runtime_extra_env — дополнительно
app_runtime_env_names:
  - RUNTIME_PROVIDER
  - RUNTIME_OS_AUTH_URL
  - RUNTIME_OS_USERNAME
  - RUNTIME_OS_PASSWORD
  - RUNTIME_OS_USER_DOMAIN_NAME
  - RUNTIME_OS_PROJECT_ID
  - RUNTIME_OS_REGION
  - RUNTIME_AVAILABILITY_ZONE
  - RUNTIME_NETWORK_ID
  - RUNTIME_SUBNET_ID
  - RUNTIME_SECURITY_GROUP_ID
  - RUNTIME_IMAGE_ID
  - RUNTIME_FLAVOR_ID
  - RUNTIME_VOLUME_TYPE
  - RUNTIME_SSH_KEY_NAME
  - RUNTIME_SSH_USER
  - RUNTIME_SSH_PRIVATE_KEY_FILE
  - RUNTIME_TLS_CA_CERT_FILE
  - RUNTIME_TLS_CA_KEY_FILE
  - RUNTIME_TLS_CLIENT_CERT_FILE
  - RUNTIME_TLS_CLIENT_KEY_FILE
  - RUNTIME_WORK_DIR
  - RUNTIME_BLOCKED_PUBLIC_IPS
  - RUNTIME_SECRETS_KEY
  - RUNTIME_ENV_NAME
