---
app_backend_image: ghcr.io/cringe-driven-development-team/backend
# BFF (infra#58): публичный образ публикует CI фронта (frontend#4), выкатывается по digest —
# bff_image_ref (infra#74)
app_bff_image: ghcr.io/cringe-driven-development-team/bff
# BFF из frontend#257 использует прокси монолита, BFF из frontend#283 — два HTTPS API.
app_bff_go_api_url: "https://{{ app_backend_address }}:8443/api/v1"
app_bff_identity_api_url: https://identity.internal.cellestial.ru:8444/api/v1
app_bff_workspace_api_url: https://workspace.internal.cellestial.ru:8445/api/v1
# mTLS BFF → Go (infra#160): TLS-прокси перед Go на VPS2, Go доступен ему только по сети app
app_api_proxy_image: nginx:1.30-alpine
# CA, сертификат и ключ хоста: на VPS2 — серверные (читает только прокси), на gateway — клиентские BFF
app_mtls_dir: "{{ app_compose_dir }}/mtls"
# Сроки leaf-сертификатов в днях: срок, порог перевыпуска и порог тревоги renew-mtls.yml (RUNBOOK, «mTLS BFF → Go»)
app_mtls_cert_days: 30
app_mtls_renew_days: 10
app_mtls_alert_days: 7
# true — перевыпустить с новым ключом, даже если сертификат действителен (аварийная замена)
app_mtls_force: false
# Пользователь bun образа BFF (oven/bun) читает клиентский ключ; nginx читает серверный от root
app_bff_uid: 1000
app_mtls_certs:
  server:
    cn: cellestial-go-api
    usage: serverAuth
    owner: 0
    service: api-proxy
  client:
    cn: cellestial-bff
    san: bff.internal.cellestial.ru
    usage: clientAuth
    owner: "{{ app_bff_uid }}"
    service: bff
app_postgres_image: postgres:18-alpine
# Redis — refresh-сессии бэка (infra#46): только сеть app, данные в volume redis_data (AOF)
app_redis_image: redis:8-alpine
app_redis_maxmemory: 128mb
# uid/gid пользователя redis в образе: конфиг с паролем читает только он
app_redis_uid: 999
app_redis_gid: 1000
app_postgres_user: postgres
app_postgres_database: app_db
app_access_token_ttl: 15m
app_refresh_token_ttl: 720h
app_wait_timeout: 180
# Runtime-VPS (infra#89): uid пользователя app в образе Go API (build/main.Dockerfile backend) — он
# читает ключи (0400) и пишет каталог заданий Ansible
app_backend_uid: 10001
# Ключи и сертификаты runtime на VPS2 → /run/secrets/runtime в контейнере Go API (каталогом, read-only)
app_runtime_secrets_dir: "{{ app_compose_dir }}/runtime-secrets"
# Плейбук настройки runtime-VPS (ansible/runtime) на VPS2 → /app/deploy/runtime (read-only)
app_runtime_playbook_dir: "{{ app_compose_dir }}/runtime-playbook"
# Каталог заданий Ansible Go API (RUNTIME_WORK_DIR): тот же путь на VPS2 и в контейнере
app_runtime_work_dir: /var/lib/cellestial/runtime
# RUNTIME_* из .env, которые Compose передаёт Go API (имена — internal/config/runtime.go backend);
# runtime_extra_env — дополнительно
app_runtime_env_names:
  - RUNTIME_PROVIDER
  - RUNTIME_OS_AUTH_URL
  - RUNTIME_OS_USERNAME
  - RUNTIME_OS_PASSWORD
  - RUNTIME_OS_USER_DOMAIN_NAME
  - RUNTIME_OS_PROJECT_ID
  - RUNTIME_OS_REGION
  - RUNTIME_AVAILABILITY_ZONE
  - RUNTIME_NETWORK_ID
  - RUNTIME_SUBNET_ID
  - RUNTIME_SECURITY_GROUP_ID
  - RUNTIME_IMAGE_ID
  - RUNTIME_FLAVOR_ID
  - RUNTIME_VOLUME_TYPE
  - RUNTIME_SSH_KEY_NAME
  - RUNTIME_SSH_USER
  - RUNTIME_SSH_PRIVATE_KEY_FILE
  - RUNTIME_TLS_CA_CERT_FILE
  - RUNTIME_TLS_CA_KEY_FILE
  - RUNTIME_TLS_CLIENT_CERT_FILE
  - RUNTIME_TLS_CLIENT_KEY_FILE
  - RUNTIME_WORK_DIR
  - RUNTIME_BLOCKED_PUBLIC_IPS
  - RUNTIME_SECRETS_KEY
  - RUNTIME_ENV_NAME
