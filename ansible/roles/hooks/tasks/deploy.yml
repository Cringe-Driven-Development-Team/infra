---
- name: Потребовать реальную выкладку с существующим состоянием
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - auxiliary_release is defined

- name: Перечитать состояние внутри очереди
  ansible.builtin.import_tasks: release-state.yml

- name: Потребовать существующую инициализацию
  ansible.builtin.assert:
    that: not hooks_release_state_needs_initialization

- name: Выбрать только запрошенный release
  ansible.builtin.set_fact:
    hooks_release_state: "{{ hooks_release_state | hooks_release_select(auxiliary_release) }}"
    hooks_deploy_service: "{{ 'githubbot' if auxiliary_release.service == 'githubbot' else 'hooks' }}"

- name: Проверить существующие файлы проекта
  ansible.builtin.stat:
    path: "{{ hooks_compose_dir }}/{{ item }}"
  loop: [compose.yml, .env, githubbot.env, Caddyfile, proxy/config.json]
  register: hooks_deploy_files

- name: Потребовать подготовленный проект без provisioning
  ansible.builtin.assert:
    that: item.stat.isreg | default(false)
  loop: "{{ hooks_deploy_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Проверить существующие Compose networks и proxy
  ansible.builtin.command:
    argv: [docker, compose, --project-directory, "{{ hooks_compose_dir }}", -f, "{{ hooks_compose_dir }}/compose.yml", ps, --all, --quiet, telegram-proxy]
  register: hooks_deploy_proxy
  changed_when: false

- name: Потребовать один запущенный proxy
  ansible.builtin.assert:
    that: hooks_deploy_proxy.stdout_lines | length == 1

- name: Проверить состояние proxy
  ansible.builtin.command:
    argv: [docker, inspect, --format, "{{ '{{.State.Running}}' }}", "{{ hooks_deploy_proxy.stdout | trim }}"]
  register: hooks_deploy_proxy_state
  changed_when: false

- name: Потребовать работающий proxy
  ansible.builtin.assert:
    that: hooks_deploy_proxy_state.stdout | trim == 'true'

- name: Прочитать исходный Compose без раскрытия env
  ansible.builtin.slurp:
    src: "{{ hooks_compose_dir }}/compose.yml"
  register: hooks_deploy_compose
  no_log: true
  diff: false

- name: Проверить структуру и постоянные данные существующего проекта
  ansible.builtin.assert:
    that:
      - hooks_deploy_existing.name == 'hooks'
      - hooks_deploy_existing.services.githubbot.volumes == ['githubbot_data:/data']
      - hooks_deploy_existing.services.hooks.volumes == ['hooks_data:/data']
      - hooks_deploy_existing.services.githubbot.env_file == 'githubbot.env'
      - hooks_deploy_existing.services.hooks.env_file == '.env'
      - hooks_deploy_existing.services.githubbot.networks == ['telegram_proxy']
      - hooks_deploy_existing.services.hooks.networks == ['hooks', 'telegram_proxy']
      - hooks_deploy_existing.services['telegram-proxy'].networks == ['telegram_proxy']
      - "'hooks' in hooks_deploy_existing.networks"
      - "'telegram_proxy' in hooks_deploy_existing.networks"
      - hooks_deploy_existing.volumes.githubbot_data == {}
      - hooks_deploy_existing.volumes.hooks_data == {}
  vars:
    hooks_deploy_existing: "{{ hooks_deploy_compose.content | b64decode | from_yaml }}"
  no_log: true
  diff: false

- name: Проверить существующие общие Docker networks
  ansible.builtin.command:
    argv: [docker, network, inspect, "{{ item }}"]
  loop: [hooks_hooks, hooks_telegram_proxy]
  changed_when: false
  no_log: true
  diff: false

- name: Проверить наличие существующих SQLite volumes
  ansible.builtin.command:
    argv: [docker, volume, inspect, "{{ item }}"]
  loop: [hooks_githubbot_data, hooks_hooks_data]
  changed_when: false
  no_log: true
  diff: false

- name: Проверить отсутствие нескольких polling контейнеров
  ansible.builtin.command:
    argv: [docker, compose, --project-directory, "{{ hooks_compose_dir }}", -f, "{{ hooks_compose_dir }}/compose.yml", ps, --all, --quiet, githubbot]
  register: hooks_deploy_bots
  changed_when: false

- name: Запретить выкладку при нескольких GitHubBot
  ansible.builtin.assert:
    that: hooks_deploy_bots.stdout_lines | length <= 1

- name: Сохранить весь Compose кроме target image
  ansible.builtin.set_fact:
    hooks_candidate_content: >-
      {{ hooks_deploy_compose.content | b64decode | from_yaml
         | combine({'services': {hooks_deploy_service: {'image': auxiliary_release.image_ref}}}, recursive=true)
         | to_nice_yaml }}
  no_log: true
  diff: false

- name: Проверить candidate без изменения постоянного Compose
  ansible.builtin.import_tasks: validate-candidate.yml
  vars:
    hooks_candidate_services: "{{ [auxiliary_release.service] }}"

- name: Записать desired до изменения Compose
  ansible.builtin.import_tasks: save-release.yml

- name: Атомарно заменить Compose
  ansible.builtin.copy:
    content: "{{ hooks_candidate_content }}"
    dest: "{{ hooks_compose_dir }}/compose.yml"
    mode: "0644"
  no_log: true
  diff: false

- name: Поднять только target без зависимостей
  community.docker.docker_compose_v2:
    project_src: "{{ hooks_compose_dir }}"
    services: "{{ [hooks_deploy_service] }}"
    dependencies: false
    state: present
    pull: never
    wait: true
    wait_timeout: 180

- name: Проверить и подтвердить только target
  ansible.builtin.import_tasks: verify-release.yml
  vars:
    hooks_verify_services: "{{ [auxiliary_release.service] }}"
