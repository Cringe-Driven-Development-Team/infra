---
- name: Проверить наличие состояния релизов
  ansible.builtin.stat:
    path: "{{ hooks_compose_dir }}/releases.json"
  register: hooks_release_state_file

- name: Прочитать сохранённое состояние релизов
  ansible.builtin.slurp:
    src: "{{ hooks_compose_dir }}/releases.json"
  register: hooks_release_state_content
  when: hooks_release_state_file.stat.exists

- name: Проверить сохранённое состояние релизов
  ansible.builtin.set_fact:
    hooks_release_state: "{{ hooks_release_state_content.content | b64decode | from_json | hooks_release_validate }}"
    hooks_release_state_needs_initialization: false
  when: hooks_release_state_file.stat.exists

- name: Подготовить явные релизы для первой установки или migration preview
  when: not hooks_release_state_file.stat.exists
  block:
    - name: Проверить наличие существующего Compose
      ansible.builtin.stat:
        path: "{{ hooks_compose_dir }}/compose.yml"
      register: hooks_release_existing_compose

    - name: Потребовать явную инициализацию состояния
      ansible.builtin.assert:
        that:
          - not hooks_release_existing_compose.stat.exists or ansible_check_mode
          - hooks_initial_releases is defined
          - hooks_initial_releases is sequence
          - hooks_initial_releases is not string
          - hooks_initial_releases | length == 2
        fail_msg: Для существующего Compose выполните отдельную initialize-операцию; для пустой VPS передайте два hooks_initial_releases.

    - name: Построить начальное состояние без записи
      ansible.builtin.set_fact:
        hooks_release_state: >-
          {{ {'version': 1, 'services': {
            hooks_initial_releases[0].service: {'desired': hooks_initial_releases[0], 'confirmed': none},
            hooks_initial_releases[1].service: {'desired': hooks_initial_releases[1], 'confirmed': none}
          }} | hooks_release_validate }}
        hooks_release_state_needs_initialization: true

    - name: Прочитать фактические образы Compose для migration preview
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ hooks_compose_dir }}"
          - -f
          - "{{ hooks_compose_dir }}/compose.yml"
          - config
          - --format
          - json
      register: hooks_release_migration_compose
      check_mode: false
      changed_when: false
      no_log: true
      diff: false
      when: hooks_release_existing_compose.stat.exists

    - name: Сверить явные релизы с существующим Compose без записи
      ansible.builtin.assert:
        that:
          - (hooks_release_migration_compose.stdout | from_json).services.githubbot.image == hooks_release_state.services.githubbot.desired.image_ref
          - (hooks_release_migration_compose.stdout | from_json).services.hooks.image == hooks_release_state.services['webhook-alerts'].desired.image_ref
        fail_msg: Migration preview требует точного совпадения обоих image_ref с существующим Compose.
      no_log: true
      diff: false
      when: hooks_release_existing_compose.stat.exists

- name: Выбрать образы обоих сервисов из desired
  ansible.builtin.set_fact:
    hooks_image: "{{ hooks_release_state.services['webhook-alerts'].desired.image_ref }}"
    hooks_image_source_tag: "{{ 'ghcr.io/cringe-driven-development-team/webhook-alerts:sha-' ~ hooks_release_state.services['webhook-alerts'].desired.source_sha }}"
    hooks_githubbot_image: "{{ hooks_release_state.services.githubbot.desired.image_ref }}"
    hooks_githubbot_image_source_tag: "{{ 'ghcr.io/cringe-driven-development-team/githubbot:sha-' ~ hooks_release_state.services.githubbot.desired.source_sha }}"
