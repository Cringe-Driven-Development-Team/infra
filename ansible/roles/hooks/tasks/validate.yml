---
- name: Проверить закреплённый образ и пути hooks
  ansible.builtin.assert:
    that:
      - hooks_image is match('^ghcr.io/cringe-driven-development-team/webhook-alerts@sha256:[0-9a-f]{64}$')
      - hooks_compose_dir == '/opt/hooks'
      - hooks_data_path == '/data'
      - hooks_command | length == 0
      - hooks_env.DATABASE_PATH == '/data/queue.sqlite'
      - hooks_env.PORT | int == hooks_port | int
    fail_msg: Образ hooks должен быть закреплён registry digest; snapshot использует /opt/hooks и /data/queue.sqlite.

- name: Проверить обязательные переменные webhook-сервиса
  ansible.builtin.assert:
    that:
      - hooks_env[item] | default('') | string | trim | length > 0
    fail_msg: "Добавьте {{ item }} в vault_hooks_env через ansible-vault edit до запуска auxiliary.yml."
    quiet: true
  loop:
    - GITHUB_WEBHOOK_SECRET
    - APIDOG_SIGNATURE_KEY
    - APIDOG_SIGNATURE_HEADER

- name: Проверить имена и однострочные значения env
  ansible.builtin.assert:
    that:
      - item.key is match('^[A-Z_][A-Z0-9_]*$')
      - item.value is string
      - (item.value | string).splitlines() | length == 1
    quiet: true
  loop: "{{ hooks_env | dict2items }}"
  no_log: true

- name: Проверить закреплённый образ Telegram proxy
  ansible.builtin.assert:
    that:
      - hooks_proxy_image is match('^ghcr.io/sagernet/sing-box@sha256:[0-9a-f]{64}$')
      - hooks_env.TELEGRAM_PROXY_URL == 'http://telegram-proxy:2080'
    fail_msg: Telegram proxy должен использовать закреплённый образ и внутренний URL.

- name: Проверить структуру секретной конфигурации Telegram proxy
  ansible.builtin.assert:
    that:
      - vault_hooks_proxy_config is defined
      - vault_hooks_proxy_config is mapping
      - "vault_hooks_proxy_config.inbounds == [{'type': 'mixed', 'listen': '0.0.0.0', 'listen_port': 2080}]"
      - vault_hooks_proxy_config.outbounds is sequence
      - vault_hooks_proxy_config.outbounds | length == 1
      - vault_hooks_proxy_config.outbounds[0] is mapping
      - vault_hooks_proxy_config.outbounds[0].type == 'vless'
      - vault_hooks_proxy_config.outbounds[0].tag == 'telegram-vless'
      - vault_hooks_proxy_config.outbounds[0].flow | default('') in ['', 'xtls-rprx-vision']
      - vault_hooks_proxy_config.outbounds[0].server is string
      - vault_hooks_proxy_config.outbounds[0].server | trim | length > 0
      - vault_hooks_proxy_config.outbounds[0].server_port is integer
      - vault_hooks_proxy_config.outbounds[0].server_port > 0
      - vault_hooks_proxy_config.outbounds[0].server_port <= 65535
      - vault_hooks_proxy_config.outbounds[0].uuid is match('^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$')
      - vault_hooks_proxy_config.outbounds[0].tls is mapping
      - vault_hooks_proxy_config.outbounds[0].tls.enabled == true
      - vault_hooks_proxy_config.outbounds[0].tls.insecure | default(false) == false
      - vault_hooks_proxy_config.outbounds[0].tls.server_name is string
      - vault_hooks_proxy_config.outbounds[0].tls.server_name | trim | length > 0
      - vault_hooks_proxy_config.outbounds[0].tls.utls is mapping
      - vault_hooks_proxy_config.outbounds[0].tls.utls.enabled == true
      - vault_hooks_proxy_config.outbounds[0].tls.utls.fingerprint is string
      - vault_hooks_proxy_config.outbounds[0].tls.utls.fingerprint | trim | length > 0
      - vault_hooks_proxy_config.outbounds[0].tls.reality is mapping
      - vault_hooks_proxy_config.outbounds[0].tls.reality.enabled == true
      - vault_hooks_proxy_config.outbounds[0].tls.reality.public_key is match('^[A-Za-z0-9_-]{43}$')
      - vault_hooks_proxy_config.outbounds[0].tls.reality.short_id is match('^([0-9a-fA-F]{2}){0,8}$')
      - "vault_hooks_proxy_config.route == {'rules': [{'domain': ['api.telegram.org'], 'action': 'route', 'outbound': 'telegram-vless'}, {'action': 'reject'}]}"
    quiet: true
    fail_msg: Проверьте vault_hooks_proxy_config через ansible-vault edit; разрешён только Telegram через VLESS Reality.
  no_log: true
