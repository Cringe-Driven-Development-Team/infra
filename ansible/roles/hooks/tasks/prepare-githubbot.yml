---
- name: Временный пустой Docker config для GitHubBot
  ansible.builtin.tempfile:
    state: directory
    suffix: .githubbot-docker
  register: hooks_githubbot_docker_config

- name: Скачать закреплённый образ GitHubBot анонимно
  block:
    - name: Скачать GitHubBot по digest без credentials
      ansible.builtin.command:
        argv:
          - docker
          - --config
          - "{{ hooks_githubbot_docker_config.path }}"
          - pull
          - "{{ hooks_githubbot_image }}"
      register: hooks_githubbot_pull
      changed_when: "'Downloaded newer image' in hooks_githubbot_pull.stdout"
      no_log: true
      diff: false
  always:
    - name: Удалить временный Docker config GitHubBot
      ansible.builtin.file:
        path: "{{ hooks_githubbot_docker_config.path }}"
        state: absent

- name: Проверить конфигурацию GitHubBot без polling
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ hooks_compose_dir }}/compose.yml"
      - run
      - --rm
      - --no-deps
      - --pull
      - never
      - githubbot
      - bun
      - run
      - src/main.ts
      - --check-config
  changed_when: false
  no_log: true
  diff: false

# uid/gid берутся из закреплённого образа; SQLite и WAL остаются на месте.
- name: Подготовить постоянный том GitHubBot для пользователя bun
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ hooks_compose_dir }}/compose.yml"
      - run
      - --rm
      - --no-deps
      - --pull
      - never
      - --user
      - root
      - --entrypoint
      - sh
      - githubbot
      - -c
      - chown -R bun:bun /data && chmod 700 /data
  changed_when: true
  no_log: true
  diff: false
