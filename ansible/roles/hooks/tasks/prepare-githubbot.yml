---
- name: Скачать GitHubBot
  ansible.builtin.import_tasks: pull-githubbot.yml
  when: not (hooks_candidate_images_pulled | default(false))

- name: Проверить конфигурацию GitHubBot без polling
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ hooks_compose_dir }}"
      - -f
      - "{{ hooks_candidate_compose | default(hooks_compose_dir ~ '/compose.yml') }}"
      - run
      - --rm
      - --no-deps
      - --pull
      - never
      - githubbot
      - bun
      - run
      - src/main.ts
      - --check-config
  changed_when: false
  no_log: true
  diff: false

# uid/gid берутся из закреплённого образа; SQLite и WAL остаются на месте.
- name: Подготовить постоянный том GitHubBot для пользователя bun
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-directory
      - "{{ hooks_compose_dir }}"
      - -f
      - "{{ hooks_candidate_compose | default(hooks_compose_dir ~ '/compose.yml') }}"
      - run
      - --rm
      - --no-deps
      - --pull
      - never
      - --user
      - root
      - --entrypoint
      - sh
      - githubbot
      - -c
      - chown -R bun:bun /data && chmod 700 /data
  changed_when: true
  no_log: true
  diff: false
