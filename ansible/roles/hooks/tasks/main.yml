---
- name: Загрузить выбранные релизы
  ansible.builtin.import_tasks: release-state.yml

- name: Проверить параметры сервиса
  ansible.builtin.import_tasks: validate.yml

- name: Проверить предполагаемый проект без изменения сервера
  ansible.builtin.import_tasks: preview.yml
  when: ansible_check_mode

- name: Применить проект
  when: not ansible_check_mode
  block:
    - name: Каталог проекта Compose
      ansible.builtin.file:
        path: "{{ hooks_compose_dir }}"
        state: directory
        mode: "0755"

    - name: Caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: "{{ hooks_compose_dir }}/Caddyfile"
        mode: "0644"
      notify: Reload caddy

    - name: Переменные сервиса
      ansible.builtin.template:
        src: env.j2
        dest: "{{ hooks_compose_dir }}/.env"
        mode: "0600"
      no_log: true

    - name: Переменные GitHubBot
      ansible.builtin.template:
        src: githubbot.env.j2
        dest: "{{ hooks_compose_dir }}/githubbot.env"
        mode: "0600"
      no_log: true
      diff: false

    - name: Каталог конфигурации Telegram proxy
      ansible.builtin.file:
        path: "{{ hooks_compose_dir }}/proxy"
        state: directory
        mode: "0700"
        owner: "65532"
        group: "65532"

    - name: Конфигурация Telegram proxy
      ansible.builtin.template:
        src: xray.json.j2
        dest: "{{ hooks_compose_dir }}/proxy/config.json"
        mode: "0600"
        owner: "65532"
        group: "65532"
      no_log: true
      diff: false
      notify: Restart telegram proxy

    - name: Проверить candidate обоих приложений до записи Compose
      ansible.builtin.import_tasks: validate-candidate.yml
      vars:
        hooks_candidate_content: "{{ lookup('ansible.builtin.template', 'compose.yml.j2') }}"
        hooks_candidate_services: [githubbot, webhook-alerts]

    - name: Сохранить начальный desired после проверки candidate
      ansible.builtin.import_tasks: save-release.yml
      when: hooks_release_state_needs_initialization

    - name: Файл compose.yml
      ansible.builtin.template:
        src: compose.yml.j2
        dest: "{{ hooks_compose_dir }}/compose.yml"
        mode: "0644"

    - name: Скачать недостающий публичный образ Caddy
      community.docker.docker_compose_v2_pull:
        project_src: "{{ hooks_compose_dir }}"
        services:
          - caddy
        policy: missing

    - name: Скачать публичный образ Telegram proxy
      community.docker.docker_compose_v2_pull:
        project_src: "{{ hooks_compose_dir }}"
        services:
          - telegram-proxy
        policy: missing

    - name: Поднять проект
      community.docker.docker_compose_v2:
        project_src: "{{ hooks_compose_dir }}"
        state: present
        pull: never
        wait: true
        wait_timeout: 180

    - name: Применить Caddyfile
      ansible.builtin.meta: flush_handlers

- name: Проверить и подтвердить оба приложения после общего apply
  ansible.builtin.import_tasks: verify-release.yml
  vars:
    hooks_verify_services: [githubbot, webhook-alerts]
  when: not ansible_check_mode
