# Проект Compose: наружу публикуется только Caddy.
hooks_compose_dir: /opt/hooks
# Registry manifest digest публикации .github main (Task 8), не локальный Docker image ID.
hooks_image: ghcr.io/cringe-driven-development-team/webhook-alerts@sha256:4424881b11af1f32a690831d5c9b87351852b4767e182e28f8703e68a90d7622
# Только трассировка исходного коммита; Compose разворачивает hooks_image по digest.
hooks_image_source_tag: ghcr.io/cringe-driven-development-team/webhook-alerts:sha-4a4064dd70939cfc043cfb625d86e07956616212
hooks_proxy_image: ghcr.io/sagernet/sing-box@sha256:0788ffbddab2c68a99a2dd4780bbc50902f159af6f589df3ee74a8389d278279
hooks_port: 8080
hooks_command: []
hooks_data_path: /data
# Worker выключен до отдельной приёмки/переключения Task 10. Секреты — только Vault.
hooks_env: >-
  {{ {'DATABASE_PATH': '/data/queue.sqlite', 'PORT': '8080', 'WEBHOOK_ALERTS_SEND_ENABLED': 'false',
       'TELEGRAM_PROXY_URL': 'http://telegram-proxy:2080'}
     | combine(vault_hooks_env | default({})) }}
