---
- name: Перечитать конфигурацию Caddy мониторинга
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - caddy
      - caddy
      - reload
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
    chdir: "{{ monitoring_compose_dir }}"
  changed_when: true

- name: Перечитать конфигурацию Prometheus
  ansible.builtin.command:
    argv: [docker, compose, kill, -s, SIGHUP, prometheus]
    chdir: "{{ monitoring_compose_dir }}"
  changed_when: true
