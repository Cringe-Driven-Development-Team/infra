---
- name: Создать каталоги проекта Caddy
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ monitoring_compose_dir }}"
    - "{{ monitoring_compose_dir }}/caddy"

- name: Настроить Caddy для Grafana
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ monitoring_compose_dir }}/caddy/Caddyfile"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      docker run --rm -v %s:/tmp/Caddyfile:ro {{ caddy_image }}
      caddy validate --config /tmp/Caddyfile --adapter caddyfile
  notify: Перечитать конфигурацию Caddy мониторинга

- name: Записать Compose-проект мониторинга
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ monitoring_compose_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Запустить Caddy мониторинга
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_compose_dir }}"
    state: present
    pull: missing
