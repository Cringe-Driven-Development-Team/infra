---
- name: Создать пользователя deploy в группе sudo
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Найти публичные ключи команды в репозитории
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/files/authorized_keys"
    patterns: "*.pub"
  delegate_to: localhost
  become: false
  register: users_team_key_files

- name: Прочитать ключи
  ansible.builtin.set_fact:
    users_authorized_keys: "{{ users_authorized_keys | default([]) + [lookup('file', item.path)] }}"
  loop: "{{ users_team_key_files.files }}"
  loop_control: { label: "{{ item.path | basename }}" }

# exclusive удаляет всё, чего нет в files/authorized_keys. Если там нет ключа того, кто
# запускает плейбук, следующий вход под deploy не пройдёт, а root-логин уже закрыт —
# останется только консоль в панели. Поэтому проверяем до записи.
- name: Ключ того, кто запускает, есть среди ключей команды
  ansible.builtin.assert:
    that:
      - users_authorized_keys | default([]) | length > 0
      - users_runner_key in (users_authorized_keys | default([]) | join('\n'))
    fail_msg: >-
      В {{ playbook_dir }}/files/authorized_keys нет ключа {{ deploy_key_path }}.pub.
      С exclusive: true он был бы удалён из authorized_keys у {{ deploy_user }} —
      добавьте свой .pub в files/authorized_keys и повторите.
    quiet: true
  vars:
    # тело ключа (второе поле): комментарий у одного и того же ключа может отличаться
    users_runner_key: "{{ lookup('file', deploy_key_path ~ '.pub').split()[1] }}"

# Один вызов со всеми ключами: цикл с exclusive перезаписал бы предыдущие итерации.
# exclusive — ушедшие участники теряют доступ при следующем прогоне.
- name: Положить публичные ключи команды в authorized_keys
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ users_authorized_keys | join('\n') }}\n"
    exclusive: true

- name: Sudo без пароля
  ansible.builtin.copy:
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
