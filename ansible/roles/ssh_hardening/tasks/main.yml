---
- name: Drop-in конфигурации SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      # Managed by Ansible
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      MaxAuthTries 4
      X11Forwarding no
      {% if ssh_hardening_jump_targets | length > 0 %}
      # Gateway — пересылка только к назначениям ssh_hardening_jump_targets: SSH VPS2 (jump, infra#59)
      # и её Go API (туннель локального BFF, infra#155)
      AllowTcpForwarding local
      PermitOpen {{ ssh_hardening_jump_targets | join(' ') }}
      {% else %}
      AllowTcpForwarding no
      {% endif %}
  notify: Restart sshd

- name: SSH-сервис включён
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
