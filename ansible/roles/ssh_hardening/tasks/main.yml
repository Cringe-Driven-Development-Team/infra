---
- name: Drop-in конфигурации SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      # Managed by Ansible
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      MaxAuthTries 4
      X11Forwarding no
      # Jump-хост больше не нужен: VPS одна, ProxyCommand/ProxyJump удалены из inventory
      AllowTcpForwarding no
      {% if ssh_hardening_root_from | default([]) | length > 0 %}
      # root — только по ключу и только из этих сетей (Coolify управляет хостом из контейнера)
      Match Address {{ ssh_hardening_root_from | join(',') }}
          PermitRootLogin prohibit-password
      # Конец условного блока: drop-in включается в начало sshd_config, без этого Match
      # распространился бы на основной конфиг
      Match all
      {% endif %}
  notify: Restart sshd

# Старое имя drop-in (99-) от предыдущих прогонов: sshd берёт первое значение, 00- его перекрывает,
# но лишний неуправляемый файл оставлять нельзя.
- name: Удалить старый drop-in 99-hardening.conf
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-hardening.conf
    state: absent

- name: SSH-сервис включён
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
