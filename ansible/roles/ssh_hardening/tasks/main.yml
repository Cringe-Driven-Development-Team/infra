---
- name: Drop-in конфигурации SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      # Managed by Ansible
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      MaxAuthTries 4
      X11Forwarding no
      {% if ssh_hardening_jump_targets | length > 0 %}
      # Gateway — jump-хост для приватной VPS2 (infra#59): пересылка только ssh -W на её SSH
      AllowTcpForwarding local
      PermitOpen {{ ssh_hardening_jump_targets | join(' ') }}
      {% else %}
      AllowTcpForwarding no
      {% endif %}
  notify: Restart sshd

# Старое имя drop-in (99-) от предыдущих прогонов: sshd берёт первое значение, 00- его перекрывает,
# но лишний неуправляемый файл оставлять нельзя.
- name: Удалить старый drop-in 99-hardening.conf
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-hardening.conf
    state: absent

- name: SSH-сервис включён
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
