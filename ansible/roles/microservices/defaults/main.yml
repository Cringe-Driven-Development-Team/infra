---
microservices_root: "{{ app_compose_dir }}/microservices"
microservices_clean_database: "{{ app_postgres_database }}_services"
microservices_clean_redis_db: 1
microservices_initial_deployment: >-
  {{ (microservices_first_cutover | default(false) | bool)
     or (microservices_clean_start | default(false) | bool) }}
microservices_order:
  - identity
  - onlineconf
  - environments
  - workspace
microservices_ports:
  identity: { http: 8444, grpc: 19090, admin: 19091 }
  workspace: { http: 8445, grpc: 29090, admin: 29091 }
  onlineconf: { http: 8446, grpc: 49090, admin: 49091 }
  environments: { grpc: 39090, admin: 39091 }
microservices_limits:
  identity: { memory: 256m, cpu: "0.75" }
  workspace: { memory: 768m, cpu: "1.25" }
  environments: { memory: 512m, cpu: "0.75" }
  onlineconf: { memory: 192m, cpu: "0.5" }
microservices_tls:
  identity: { cn: identity.internal.cellestial.ru, san: identity.internal.cellestial.ru, usage: "serverAuth,clientAuth", owner: 10001 }
  workspace: { cn: workspace.internal.cellestial.ru, san: workspace.internal.cellestial.ru, usage: "serverAuth,clientAuth", owner: 10001 }
  environments: { cn: environments.internal.cellestial.ru, san: environments.internal.cellestial.ru, usage: "serverAuth,clientAuth", owner: 10001 }
  onlineconf: { cn: onlineconf.internal.cellestial.ru, san: onlineconf.internal.cellestial.ru, usage: "serverAuth,clientAuth", owner: 10001 }
  probe: { cn: probe.internal.cellestial.ru, san: probe.internal.cellestial.ru, usage: clientAuth, owner: 0 }
microservices_runtime_dir: "{{ app_compose_dir }}/runtime-playbook"
microservices_runtime_secrets_dir: "{{ app_compose_dir }}/runtime-secrets"
microservices_runtime_work_dir: /var/lib/cellestial/runtime
microservices_aws:
  AWS_REGION: "{{ s3_region }}"
  AWS_ACCESS_KEY_ID: "{{ avatars_s3_access_key }}"
  AWS_SECRET_ACCESS_KEY: "{{ avatars_s3_secret_key }}"
  AWS_ENDPOINT_URL_S3: "{{ s3_endpoint }}"
  S3_AVATARS_BUCKET: "{{ avatars_bucket }}"
  S3_AVATARS_PUBLIC_URL: "https://{{ avatars_public_domain }}"
microservices_runtime_env:
  RUNTIME_PROVIDER: "{{ runtime_provider }}"
  RUNTIME_OS_AUTH_URL: "{{ runtime_os_auth_url }}"
  RUNTIME_OS_USERNAME: "{{ runtime_os_username }}"
  RUNTIME_OS_PASSWORD: "{{ runtime_os_password }}"
  RUNTIME_OS_USER_DOMAIN_NAME: "{{ runtime_os_user_domain_name }}"
  RUNTIME_OS_PROJECT_ID: "{{ runtime_os_project_id }}"
  RUNTIME_OS_REGION: "{{ runtime_os_region }}"
  RUNTIME_AVAILABILITY_ZONE: "{{ runtime_availability_zone }}"
  RUNTIME_NETWORK_ID: "{{ runtime_network_id }}"
  RUNTIME_SUBNET_ID: "{{ runtime_subnet_id }}"
  RUNTIME_SECURITY_GROUP_ID: "{{ runtime_security_group_id }}"
  RUNTIME_IMAGE_ID: "{{ runtime_image_id }}"
  RUNTIME_FLAVOR_ID: "{{ runtime_flavor_id }}"
  RUNTIME_VOLUME_TYPE: "{{ runtime_volume_type }}"
  RUNTIME_SSH_KEY_NAME: "{{ runtime_ssh_key_name }}"
  RUNTIME_SSH_USER: "{{ runtime_ssh_user }}"
  RUNTIME_SSH_PRIVATE_KEY_FILE: /run/secrets/runtime/ssh_key
  RUNTIME_TLS_CA_CERT_FILE: /run/secrets/runtime/ca.crt
  RUNTIME_TLS_CA_KEY_FILE: /run/secrets/runtime/ca.key
  RUNTIME_TLS_CLIENT_CERT_FILE: /run/secrets/runtime/grpc-client.crt
  RUNTIME_TLS_CLIENT_KEY_FILE: /run/secrets/runtime/grpc-client.key
  RUNTIME_WORK_DIR: "{{ microservices_runtime_work_dir }}"
  RUNTIME_BLOCKED_PUBLIC_IPS: "{{ runtime_blocked_public_ips }}"
  RUNTIME_ENV_NAME: "{{ runtime_env_name }}"
  RUNTIME_SECRETS_KEY: "{{ runtime_secrets_key }}"
  AGENT_GRPC_PORT: "9090"
