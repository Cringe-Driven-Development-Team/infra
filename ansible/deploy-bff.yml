---
# Выкатка и откат BFF (infra#58, infra#74; CD/rollback frontend#4): bff_image_ref — опубликованный
# публичный образ по digest, bff_release_sha — полный SHA его релиза. Образ скачивается анонимно и
# сверяется до изменения VPS; Go остаётся на своём теге; Caddy переключается на BFF после healthy.
- name: Deploy BFF to the single VPS
  hosts: gateway
  become: true
  gather_facts: false
  vars:
    app_deploy_service: bff
  pre_tasks:
    - name: Require exactly one deployment host
      ansible.builtin.assert:
        that:
          - groups['gateway'] | length == 1
          - ansible_play_hosts_all | length == 1
        fail_msg: >-
          Supply bff_image_ref=<image>@sha256:<digest>, bff_release_sha=<sha> and an inventory with
          one gateway.
      tags: validation

    - name: Validate before changing the server
      ansible.builtin.import_tasks: roles/app/tasks/validate.yml
      tags: validation

    - name: Pull and check the image before changing the server
      ansible.builtin.import_tasks: roles/app/tasks/pull-bff.yml

    - name: Gather server facts
      ansible.builtin.setup:
  roles:
    - caddy
    - app
  post_tasks:
    - name: Check the running BFF container
      ansible.builtin.import_tasks: roles/app/tasks/check-bff-image.yml
      vars:
        bff_check_ref: "{{ bff_image_ref }}"

    - name: Check the BFF through public Caddy
      ansible.builtin.import_tasks: roles/app/tasks/probe-bff.yml
      vars:
        bff_probe_release: "{{ bff_release_sha }}"
